<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>探针</title>
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>try{var t=localStorage.getItem("paper-theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);var a=localStorage.getItem("paper-accent");if(a)document.documentElement.setAttribute("data-accent",a)}catch(e){}</script>
<style>
:root{--ok:#3a8a5c;--warn:#9a6014;--bad:#b8433a;color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
[data-theme=dark]{--ok:#5fb48a;--warn:#d39a4f;--bad:#de7a72;color-scheme:dark}

/* 强调色方案：每种强调色自带一套明暗底色（底色、纸面、边线、文字全部带同色相微染），切换后整页色温跟着变 */
:root,html[data-accent="blue"]{--bg:#eaeef3;--paper:#fafbfd;--text:#17202b;--muted:#5c6570;--border:#d7dee7;--border-item:#afb9c6;--hover:#f2f4f8;--selected:#dce8f7;--accent:#1d5caf;--accent-line:#b7ceeb;--accent-surface:#ecf3fb;--track:#dde3eb}
[data-theme=dark],html[data-theme="dark"][data-accent="blue"]{--bg:#0c1015;--paper:#131920;--text:#dce2ea;--muted:#959fac;--border:#232b37;--border-item:#3e4856;--hover:#19212c;--selected:#162841;--accent:#71aaf4;--accent-line:#213e64;--accent-surface:#101f32;--track:#232b37}
html[data-accent="emerald"]{--bg:#eaf3f0;--paper:#fafdfc;--text:#172b24;--muted:#5c7069;--border:#d8e7e2;--border-item:#afc5be;--hover:#f2f7f6;--selected:#ddf6ed;--accent:#0d7351;--accent-line:#b9e9d9;--accent-surface:#edfaf6;--track:#deeae6}
html[data-theme="dark"][data-accent="emerald"]{--bg:#0d1412;--paper:#141f1b;--text:#dceae5;--muted:#95aca4;--border:#233630;--border-item:#3e554e;--hover:#192b25;--selected:#174032;--accent:#59cfa8;--accent-line:#23614d;--accent-surface:#123126;--track:#233630}
html[data-accent="amber"]{--bg:#f5efe8;--paper:#fdfcfa;--text:#2b2217;--muted:#70675c;--border:#ebe0d4;--border-item:#cbbbaa;--hover:#f9f5f1;--selected:#fcebd6;--accent:#9c590d;--accent-line:#f6d4ac;--accent-surface:#fef4e9;--track:#eee5db}
html[data-theme="dark"][data-accent="amber"]{--bg:#17110b;--paper:#231a10;--text:#eae3dc;--muted:#aca195;--border:#3b2e1e;--border-item:#5c4b38;--hover:#302315;--selected:#4a2d0d;--accent:#f0a44c;--accent-line:#714514;--accent-surface:#38230a;--track:#3b2e1e}
html[data-accent="purple"]{--bg:#ede9f3;--paper:#fbfafd;--text:#1e172b;--muted:#635c70;--border:#ddd7e8;--border-item:#b7aec7;--hover:#f4f2f8;--selected:#e6dbf8;--accent:#6837be;--accent-line:#cab6ed;--accent-surface:#f2ecfb;--track:#e2ddeb}
html[data-theme="dark"][data-accent="purple"]{--bg:#0f0c15;--paper:#181320;--text:#e1dcea;--muted:#9e95ac;--border:#2a2237;--border-item:#463d57;--hover:#20182d;--selected:#251443;--accent:#b591f3;--accent-line:#391e66;--accent-surface:#1c0f33;--track:#2a2237}
html[data-accent="zinc"]{--bg:#edeeef;--paper:#fbfbfc;--text:#171e2b;--muted:#5c6370;--border:#dddfe1;--border-item:#b8b9bd;--hover:#f4f5f5;--selected:#e6e8ec;--accent:#373b43;--accent-line:#cccfd7;--accent-surface:#f2f3f5;--track:#e3e4e6}
html[data-theme="dark"][data-accent="zinc"]{--bg:#101011;--paper:#18191b;--text:#dce1ea;--muted:#959dac;--border:#2a2c2f;--border-item:#47494d;--hover:#202224;--selected:#272a30;--accent:#c8cbd0;--accent-line:#3b4049;--accent-surface:#1e2025;--track:#2a2c2f}
html[data-accent="rose"]{--bg:#f4e9ec;--paper:#fdfafb;--text:#2b171c;--muted:#705c61;--border:#e8d6da;--border-item:#c7adb3;--hover:#f8f2f3;--selected:#f9dae1;--accent:#b52648;--accent-line:#eeb4c1;--accent-surface:#fcebef;--track:#ecdde0}
html[data-theme="dark"][data-accent="rose"]{--bg:#150c0e;--paper:#211216;--text:#eadcdf;--muted:#ac959b;--border:#382127;--border-item:#583c42;--hover:#2d171d;--selected:#44121e;--accent:#f17e99;--accent-line:#681c2e;--accent-surface:#340e17;--track:#382127}

*{box-sizing:border-box}
body{margin:0;font-size:14px;min-height:100dvh}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit;background:none;border:0}
a{color:inherit}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button:hover{background:var(--hover)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
@media(min-width:821px){
 html,body{height:100%;overflow:hidden}
 body{display:flex;flex-direction:column}
 .wrap{max-width:1400px;width:100%;margin:0 auto;padding:10px 16px;height:100dvh;display:flex;flex-direction:column;box-sizing:border-box}
 .notice{margin:0 0 8px;padding:8px 14px;background:var(--accent-surface);border:1px solid var(--accent-line);border-radius:6px;color:var(--accent);font-size:12px;white-space:pre-wrap;word-break:break-word;flex-shrink:0}
 .app{background:var(--paper);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:0;box-shadow:0 6px 24px rgba(0,0,0,.05)}
 .app-header{flex-shrink:0;min-height:52px;padding:0 24px}
 .toolbar{flex-shrink:0;min-height:48px;padding:0 16px 0 20px}
 .layout{flex:1;min-height:0;display:grid;grid-template-columns:360px minmax(0,1fr);height:100%}
 .list-col{height:100%;overflow-y:auto;border-right:1px solid var(--border);position:static;scrollbar-width:none;-ms-overflow-style:none}
 .list-col::-webkit-scrollbar{display:none}
 .detail{height:100%;overflow-y:auto;padding:18px 28px 28px;min-width:0;scrollbar-width:none;-ms-overflow-style:none}
 .detail::-webkit-scrollbar{display:none}
 .footer{flex-shrink:0}
}
@media(max-width:820px){
 .wrap{max-width:1140px;margin:12px auto 40px;padding:0 12px}
 .notice{margin:0 0 10px;padding:10px 16px;background:var(--accent-surface);border:1px solid var(--accent-line);border-radius:6px;color:var(--accent);font-size:13px;white-space:pre-wrap;word-break:break-word}
 .app{background:var(--paper);border:1px solid var(--border);border-radius:6px;overflow:hidden}
}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;border-bottom:1px solid var(--border);gap:16px;min-height:52px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex-shrink:0}
.brand img{width:22px;height:22px;border-radius:4px}
h1{font-size:18px;font-weight:650;margin:0;letter-spacing:-0.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:16px;min-width:0}
.summary-inline{display:flex;align-items:center;gap:18px;font-size:12px;color:var(--muted);white-space:nowrap}
.summary-inline .sum-nodes{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--text)}
.summary-inline .sum-nodes b{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:13px;font-weight:600;color:var(--accent)}
.summary-inline .sum-nodes small{color:var(--muted);font-weight:400;margin-left:2px}
.summary-inline .sum-stat{display:flex;align-items:baseline;gap:5px}
.summary-inline .sum-stat b{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-weight:500;color:var(--text);font-size:12px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;flex-shrink:0}
.dot.off{background:var(--muted);opacity:.6}
.header-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.icon-button{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px}

.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 20px;min-height:48px;border-bottom:1px solid var(--border);gap:16px}
.filters{display:flex;gap:12px;align-self:stretch;overflow-x:auto;scrollbar-width:none;min-width:0;align-items:center}
.filters::-webkit-scrollbar{display:none}
.filter{padding:0 6px;border-bottom:2px solid transparent;border-radius:0;white-space:nowrap;font-size:13px;color:var(--muted);height:100%;display:inline-flex;align-items:center}
.filter.active{border-color:var(--accent);color:var(--accent);font-weight:550}
.filter span{margin-left:5px;font-size:11px;color:var(--muted);background:var(--selected);border-radius:3px;padding:1px 5px}
.filter.active span{color:var(--accent)}
.tools{display:flex;align-items:center;gap:8px;min-width:0;flex-shrink:0}
.search{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid transparent;border-radius:4px;padding:0 8px;width:200px;min-width:0;color:var(--muted);height:32px;transition:border-color .15s}
.search:focus-within{border-color:var(--accent-line);background:var(--paper)}
.search svg{width:14px;height:14px;flex-shrink:0}
.search input{width:100%;height:100%;min-height:auto;min-width:0;border:0;background:transparent;color:var(--text);font-size:12px}
.search input:focus,.search input:focus-visible{outline:none}
.search input::placeholder{color:var(--muted)}
.sort-wrap{position:relative;flex-shrink:0}
.sort-btn{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid transparent;border-radius:4px;padding:0 9px;height:32px;color:var(--text);font-size:12px;white-space:nowrap;transition:border-color .15s}
.sort-btn:hover{background:var(--hover);border-color:var(--border)}
.sort-btn.active{border-color:var(--accent-line);background:var(--accent-surface);color:var(--accent);font-weight:500}
.sort-btn svg{width:13px;height:13px;color:var(--muted);flex-shrink:0}
.sort-btn.active svg{color:var(--accent)}
.sort-btn .sort-caret{width:12px;height:12px;transition:transform .15s}
.sort-wrap.open .sort-btn{border-color:var(--accent-line);background:var(--paper)}
.sort-wrap.open .sort-caret{transform:rotate(180deg)}
.sort-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:136px;padding:4px;background:var(--paper);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:30;display:none}
[data-theme=dark] .sort-menu{box-shadow:0 10px 28px rgba(0,0,0,.45)}
.sort-wrap.open .sort-menu{display:block}
.sort-opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:0 9px;height:32px;border-radius:4px;font-size:12px;color:var(--text);text-align:left;white-space:nowrap}
.sort-opt:hover{background:var(--hover)}
.sort-opt.active{background:var(--selected);color:var(--accent);font-weight:550}
.sort-opt svg{width:14px;height:14px;color:var(--accent);opacity:0;flex-shrink:0}
.sort-opt.active svg{opacity:1}
/* layout handled by media queries */
.list-heading{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:16px 22px;border-bottom:1px solid var(--border)}
@media(min-width:821px){
 .list-heading{display:none !important}
}
.m-list-tools{display:none}
.item{display:block;width:100%;text-align:left;padding:15px 22px 18px 20px;border-bottom:1px solid var(--border-item);border-left:2px solid transparent;border-radius:0}
.item.selected{background:var(--selected);border-left-color:var(--accent)}
.item .r1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .name-wrap{display:inline-flex;align-items:center;gap:7px;min-width:0;flex:1}
.item .name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.selected .name{color:var(--accent)}
.st{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;flex-shrink:0}
.st.bad{color:var(--bad)}
.item .r2{margin-top:6px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flag{display:inline-flex;align-items:center;justify-content:center;width:18px;height:13.5px;border-radius:2px;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 1px rgba(128,128,128,.24)}
.flag.lg{width:22px;height:16.5px;border-radius:2.5px}
.flag svg{width:100%;height:100%;display:block;stroke:none;stroke-width:0;fill:none}
.flag-code{font:600 9px/1 ui-monospace,Consolas,monospace;color:var(--muted);background:var(--track)}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.item-traffic{margin-top:10px;font-size:11px;color:var(--muted)}
.item-traffic-head{display:flex;justify-content:space-between;align-items:center;line-height:1.2}
.item-traffic-head b{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.item-traffic .bar{height:3px;background:var(--track);border-radius:2px;margin-top:5px;overflow:hidden}
.item-traffic .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.item-traffic .bar i.warn{background:var(--warn)}
.item-traffic .bar i.bad{background:var(--bad)}

.uptime-card{border:1px solid var(--border);border-radius:4px;padding:10px 14px;margin-top:12px;background:var(--paper);position:relative}
.uptime-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}
.uptime-title{font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.uptime-title .dot{width:6px;height:6px}
.uptime-rate{font:600 13px ui-monospace,Consolas,monospace;color:var(--accent)}
.uptime-bars-wrap{position:relative;width:100%;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:crosshair;padding:4px 0}
.status-bars{display:flex;align-items:flex-end;gap:3px;height:22px;width:100%;pointer-events:none}
.status-bar{flex:1;height:20px;background:var(--track);border-radius:2px;position:relative;transition:opacity .15s}
.status-bar.up,.ut-dot.up{background:var(--ok)}
.status-bar.warn,.ut-dot.warn{background:var(--warn)}
.status-bar.down,.ut-dot.down{background:var(--bad)}
.ut-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.ut-t{font-weight:600}
.ut-r{margin-top:2px;display:flex;align-items:center;gap:6px}
.status-bar.blank{background:var(--track);opacity:.45}
.status-bar.active{opacity:1;filter:brightness(1.25);transform:scaleY(1.15)}
.status-bars.dim .status-bar:not(.active){opacity:.4}
.uptime-cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none;display:none;z-index:2;border-radius:1px}
.uptime-tooltip{position:absolute;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--paper);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.15);pointer-events:none;white-space:nowrap;display:none;z-index:5;line-height:1.4}
.uptime-tooltip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-4px;border:4px solid transparent;border-top-color:var(--border)}
.uptime-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}

.meter{font-size:12px;color:var(--muted)}
.meter b{font-weight:400;color:var(--text);margin-left:4px;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--track);border-radius:2px;margin-top:5px;overflow:hidden}
.bar.muted-bar{opacity:.25}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.bar i.warn{background:var(--warn)}
.bar i.bad{background:var(--bad)}
.item.offline .name,.item.offline .meters,.item.offline .flag{opacity:.55}
.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13px}
/* detail handled by media queries */
.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.d-head-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.d-agent{font:500 12px/1.2 ui-monospace,Consolas,monospace;color:var(--muted);background:var(--track);padding:2px 7px;border-radius:3px}

.d-head h2{margin:0;font-size:20px;font-weight:600;letter-spacing:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:9px;min-width:0}
.d-time{font-size:12px;color:var(--muted);white-space:nowrap}
.d-sub{margin-top:6px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.back{display:none;align-items:center;gap:6px;min-height:44px;padding:0 10px 0 4px;margin:0 0 6px -4px;border-radius:4px;font-size:13px;color:var(--accent)}
.stats{margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--accent-surface);border:1px solid var(--accent-line);border-radius:4px}
.stat{padding:13px 16px;min-width:0;border-right:1px solid var(--accent-line)}
.stat:last-child{border-right:0}
.stat .lb{font-size:12px;color:var(--muted)}
.stat .v{margin-top:6px;font:500 26px/1.2 ui-monospace,"SFMono-Regular",Consolas,monospace;color:var(--accent);letter-spacing:-.5px;white-space:nowrap}
.stat .v small{font-size:13px;letter-spacing:0}
.stat .v.two{font-size:15px;line-height:1.55;letter-spacing:0}
.stat .sub{margin-top:6px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.stat .bar{background:var(--accent-line);opacity:.8}
.sec-title{margin:30px 0 10px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-title.plain{margin-top:30px}
.traffic{border:1px solid var(--border);border-radius:4px;padding:14px 18px}
.traffic .tr{display:flex;justify-content:space-between;font-size:13px;gap:10px;flex-wrap:wrap}
.traffic .tr span{color:var(--muted)}
.traffic .tr-day{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.traffic .bar{height:5px;margin-top:10px}
.info{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.info div{display:flex;justify-content:space-between;gap:16px;padding:11px 18px;border-bottom:1px solid var(--border);font-size:13px;min-width:0}
.info div:nth-child(odd){border-right:1px solid var(--border)}
.info div:nth-last-child(-n+2){border-bottom:0}
.info.odd div:last-child{border-bottom:0;border-right:0;grid-column:1/-1}
.info dt,.info span.k{color:var(--muted);white-space:nowrap}
.info span.val{text-align:right;overflow-wrap:anywhere;min-width:0}
.info span.val.warn{color:var(--warn);font-weight:500}
.info span.val.bad{color:var(--bad);font-weight:500}
.ranges{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.range{min-height:28px;min-width:36px;padding:0 9px;border-radius:4px;font-size:12px;color:var(--muted);border:1px solid transparent}
.range.active{color:var(--accent);border-color:var(--accent-line);background:var(--accent-surface);font-weight:500}
.chart-card{border:1px solid var(--border);border-radius:4px;padding:14px 16px 12px;margin-bottom:12px}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.chart-header h3{margin:0;font-size:13px;font-weight:600;display:inline-flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.chart-sub{font-size:12px;font-weight:400;color:var(--muted)}
.chart-toggles{display:inline-flex;border:1px solid var(--border);border-radius:4px;padding:1px;background:var(--bg)}
.chart-toggle{padding:2px 8px;font-size:12px;min-height:24px;border-radius:3px;color:var(--muted);cursor:pointer;background:transparent;border:0;line-height:1.2}
.chart-toggle.active{color:var(--accent);background:var(--paper);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.smooth-btn{min-height:28px;padding:0 9px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--muted)}
.smooth-btn.active{color:var(--accent);border-color:var(--accent-line);background:var(--accent-surface);font-weight:500;box-shadow:none}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin:16px 0 12px}

.tab-content.active{display:block}

.legend-item:hover{background:var(--hover);color:var(--text)}
.legend-item.off{opacity:.35;text-decoration:line-through}

.legend-item.off .loss-badge{opacity:.5}
.lg-name,.lg-meta{display:inline-flex;align-items:center}
.legend i,.legend-item i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex-shrink:0}
.legend b,.legend-item b{font-weight:400;color:var(--text);margin-left:5px;font-variant-numeric:tabular-nums}
.loss-badge{font-size:12px;font-weight:500;padding:0 5px;border-radius:3px;margin-left:6px;font-variant-numeric:tabular-nums}
.loss-badge.zero{color:var(--muted);background:var(--track);opacity:.8}
.loss-badge.warn{color:var(--warn);background:rgba(220,164,87,.15)}
.loss-badge.bad{color:var(--bad);background:rgba(214,109,109,.15)}
.tip .loss{color:var(--muted)}
.tip .loss.warn{color:var(--warn)}
.tip .loss.bad{color:var(--bad)}

.chart{position:relative;height:170px;touch-action:pan-y}

.chart canvas{width:100%;height:100%;display:block}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--paper);border:1px solid var(--border);border-radius:4px;padding:7px 10px;font-size:12px;line-height:1.6;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap;display:none;z-index:2}
.tip .t{color:var(--muted)}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.nodata{height:170px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.footer{display:flex;justify-content:space-between;gap:12px;padding:12px 28px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);flex-wrap:wrap}
.footer .live{display:flex;align-items:center;gap:8px}
.footer .live.err{color:var(--bad)}
.footer .live.err .dot{background:var(--bad)}
/* 移动端迷你徽标与搜索栏样式 */
.m-badge{display:none}
.search-close{display:none}

 .back{display:inline-flex;padding:0 8px;margin-bottom:10px;font-size:13px;font-weight:500}

}

<body>
<div class="wrap">
 <div class="notice" id="notice" hidden></div>
 <div class="app" id="app">
  <header class="app-header">
   <div class="brand"><img src="/favicon.svg" alt="" id="logo" onerror="this.remove()"><h1 id="siteName">探针</h1><span class="m-badge" id="mBadge"><span class="dot"></span><b>0</b><small>/ 0</small></span></div>
   <div class="header-right">
    <div class="summary-inline" id="summary"></div>
    <div class="header-actions">
     <button class="icon-button" id="themeBtn" type="button" aria-label="切换明暗"></button>
    </div>
   </div>
  </header>
  <div class="toolbar">
   <div class="filters" id="filters"></div>
   <div class="tools">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input id="q" type="search" placeholder="搜索节点" autocomplete="off"></label>
    <div class="sort-wrap" id="sortWrap"></div>
   </div>
  </div>
  <div class="layout">
   <aside class="list-col">
    <div class="list-heading">
     <div class="m-list-tools">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input id="mq" type="search" placeholder="搜索节点" autocomplete="off"></label>
      <div class="sort-wrap" id="msortWrap"></div>
     </div>
    </div>
    <div id="list"></div>
   </aside>
   <main class="detail" id="detail"></main>
  </div>
  <footer class="footer"><div class="live" id="live"><span class="dot"></span><span id="liveText">连接中</span></div><div id="foot">点击节点查看详情</div></footer>
 </div>
</div>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var SHORT="paper";
var ICON={
 moon:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>',
 sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>'
};
var S={nodes:[],admin:false,me:{history_days:7,site_name:""},cfg:{notice:"",mode:"auto",accent:"blue"},group:-1,q:"",sort:"default",routeId:null,loaded:false,hours:6,detailId:null,seq:0,lastFrame:0,ws:null,wsFails:0,err:"",cpuScale:"fit",memScale:"fit",diskScale:"fit",detailTab:"res",smooth:true,statusMap:{},statusAt:{},loadingStatus:{},hiddenProbes:{},lastHistoryData:null,listScroll:0};

/* ---------- 工具 ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(v){return typeof v==="number"&&isFinite(v)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
/* 内容不变就不碰 DOM：实时推送每几秒一帧，整块重写会打断悬停、焦点和提示框 */
function setHTML(el,h){if(el&&el._h!==h){el.innerHTML=h;el._h=h;return true}return false}
function bytes(n){if(!num(n))return"—";var u=["B","KB","MB","GB","TB","PB"],i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return(n>=100||i===0?n.toFixed(0):n>=10?n.toFixed(1):n.toFixed(2))+" "+u[i]}
function speed(n){return num(n)?bytes(n)+"/s":"—"}
function pct(v){return num(v)?(v>=100?"100":v.toFixed(v<10?1:0))+"%":"—"}
function ratio(a,b){return num(a)&&num(b)&&b>0?Math.min(100,a/b*100):null}
function uptime(s){if(!num(s))return"—";var d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d>0?d+" 天 "+h+" 时":h>0?h+" 时 "+m+" 分":m+" 分"}
function ago(s){if(!num(s))return"离线";return s<3600?"离线 "+Math.max(1,Math.round(s/60))+" 分":s<86400?"离线 "+Math.floor(s/3600)+" 时":"离线 "+Math.floor(s/86400)+" 天"}
function money(a,c){try{return new Intl.NumberFormat("zh-CN",{style:"currency",currency:c,maximumFractionDigits:2}).format(a)}catch(e){return c+" "+Number(a).toFixed(2)}}
var CYC={monthly:"月付",quarterly:"季付",semiannual:"半年付",yearly:"年付",biennial:"两年付",triennial:"三年付",once:"一次性"};
function cycle(c){if(CYC[c])return CYC[c];var m=/^(\d+)m$/.exec(c||"");return m?m[1]+" 个月":(c||"")}
function expire(n){if(n.expires_in===undefined||n.expires_in===null)return"";var d=n.expires_in;return d<0?"已过期 "+(-d)+" 天":d===0?"今天到期":d+" 天后到期"}
function barCls(p){return p>=90?"bad":p>=75?"warn":""}
function hhmm(t){var d=new Date(t*1000),p=function(x){return x<10?"0"+x:""+x};return p(d.getHours())+":"+p(d.getMinutes())}
function mdhm(t){var d=new Date(t*1000),p=function(x){return x<10?"0"+x:""+x};return p(d.getMonth()+1)+"-"+p(d.getDate())+" "+hhmm(t)}
function mp(n){return n.metrics&&typeof n.metrics==="object"?n.metrics:null}
function find(id){for(var i=0;i<S.nodes.length;i++)if(S.nodes[i].id===id)return S.nodes[i];return null}
function api(path){return fetch(path,{credentials:"same-origin"}).then(function(r){
 var ct=r.headers.get("content-type")||"";
 if(!r.ok){return(ct.indexOf("text/plain")===0?r.text():Promise.resolve("请求失败 "+r.status)).then(function(t){throw new Error(t)})}
 if(ct.indexOf("json")<0)throw new Error("响应格式异常");
 return r.json()})}

/* ---------- 主题 ---------- */
var MQ=window.matchMedia?matchMedia("(prefers-color-scheme:dark)"):null;
/* 默认值：站点配置为 auto 时跟随系统；用户手选的明暗存本地，与默认值一致时清掉，继续跟随系统 */
function baseTheme(){return S.cfg.mode==="light"||S.cfg.mode==="dark"?S.cfg.mode:(MQ&&MQ.matches?"dark":"light")}
function userTheme(){var s=lsGet("paper-theme");return s==="light"||s==="dark"?s:null}
var ACCENTS=["blue","emerald","amber","purple","zinc","rose"];
function applyAccent(acc){var a=acc||S.cfg.accent;if(ACCENTS.indexOf(a)<0)a="blue";document.documentElement.setAttribute("data-accent",a)}
function applyTheme(){
 var t=userTheme()||baseTheme();
 var root=document.documentElement,changed=root.getAttribute("data-theme")!==t;
 root.setAttribute("data-theme",t);applyAccent(S.cfg.accent);
 var b=$("#themeBtn"),lb=t==="dark"?"切换为浅色":"切换为深色";
 b.innerHTML=t==="dark"?ICON.sun:ICON.moon;b.title=lb;b.setAttribute("aria-label",lb);
 if(changed)repaintCharts()}
$("#themeBtn").onclick=function(){var next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";if(next===baseTheme())lsDel("paper-theme");else lsSet("paper-theme",next);applyTheme()};
if(MQ){var onMQ=function(){if(!userTheme())applyTheme()};if(MQ.addEventListener)MQ.addEventListener("change",onMQ);else if(MQ.addListener)MQ.addListener(onMQ)}

/* ---------- 数据与分组 ---------- */
function groups(){var g=[],seen={};S.nodes.forEach(function(n){var k=n.group||"";if(k&&!seen[k]){seen[k]=1;g.push(k)}});return g}
function inGroup(n){if(S.group===-1)return true;var k=n.group||"";return S.group===-2?!k:k===groups()[S.group]}
var SORT_OPTS=[
 {k:"default",label:"默认排序"},
 {k:"cpu",label:"CPU 占用"},
 {k:"mem",label:"内存占用"},
 {k:"disk",label:"磁盘占用"},
 {k:"net",label:"实时速率"},
 {k:"traffic",label:"月流量"},
 {k:"expire",label:"到期时间"}
];
var SORTS=SORT_OPTS.map(function(o){return o.k});
function sortKey(n,mode){
 var m=mp(n);
 if(mode==="cpu")return n.online&&m&&num(m.cpu)?m.cpu:null;
 if(mode==="mem")return n.online&&m?ratio(m.mem_used,m.mem_total):null;
 if(mode==="disk")return n.online&&m?ratio(m.disk_used,m.disk_total):null;
 if(mode==="net")return n.online&&m&&(num(m.net_rx)||num(m.net_tx))?(num(m.net_rx)?m.net_rx:0)+(num(m.net_tx)?m.net_tx:0):null;
 if(mode==="traffic")return num(n.month_used)?n.month_used:(num(n.month_rx)&&num(n.month_tx)?n.month_rx+n.month_tx:null);
 if(mode==="expire")return num(n.expires_in)?n.expires_in:null;
 return null;
}
function visible(){var q=S.q.trim().toLowerCase();var list=S.nodes.filter(function(n){
 if(!inGroup(n))return false;if(!q)return true;
 return[n.name,n.country,n.group,n.os,n.public_remark].join(" ").toLowerCase().indexOf(q)>=0});
 if(S.sort==="default")return list;
 var asc=S.sort==="expire";
 return list.slice().sort(function(a,b){
  var va=sortKey(a,S.sort),vb=sortKey(b,S.sort);
  if(va===null&&vb===null)return 0;
  if(va===null)return 1;
  if(vb===null)return -1;
  return asc?(va-vb):(vb-va);
 })}
function desktop(){return matchMedia("(min-width:821px)").matches}
function selId(){if(S.routeId!==null)return S.routeId;if(!desktop())return null;var v=visible();return v.length?v[0].id:null}

/* ---------- 渲染 ---------- */
function renderSummary(){
 var ns=S.nodes.filter(inGroup),on=ns.filter(function(n){return n.online});
 var rx=0,tx=0,tr=0;on.forEach(function(n){var m=mp(n);if(m){rx+=num(m.net_rx)?m.net_rx:0;tx+=num(m.net_tx)?m.net_tx:0}});
 ns.forEach(function(n){tr+=num(n.month_used)?n.month_used:(num(n.month_rx)&&num(n.month_tx)?n.month_rx+n.month_tx:0)});
 setHTML($("#summary"),'<div class="sum-nodes"><span class="dot"></span>在线 <b>'+on.length+'</b><small>/ '+ns.length+'</small></div>'+
  '<div class="sum-stat">下行 <b>'+esc(speed(rx))+'</b></div>'+
  '<div class="sum-stat">上行 <b>'+esc(speed(tx))+'</b></div>'+
  '<div class="sum-stat">本月 <b>'+esc(bytes(tr))+'</b></div>');
 setHTML($("#mBadge"),'<span class="dot'+(on.length?"":" off")+'"></span><b>'+on.length+'</b><small>/ '+ns.length+'</small>')}
function renderFilters(){
 var g=groups(),ungrouped=S.nodes.filter(function(n){return!n.group}).length;
 var h='<button class="filter'+(S.group===-1?' active':'')+'" data-g="-1">全部<span>'+S.nodes.length+'</span></button>';
 g.forEach(function(name,i){var c=S.nodes.filter(function(n){return n.group===name}).length;h+='<button class="filter'+(S.group===i?' active':'')+'" data-g="'+i+'">'+esc(name)+'<span>'+c+'</span></button>'});
 if(g.length&&ungrouped)h+='<button class="filter'+(S.group===-2?' active':'')+'" data-g="-2">未分组<span>'+ungrouped+'</span></button>';
 $("#filters").style.display=g.length?"":"none";
 setHTML($("#filters"),h)}
function meter(label,p){return'<div class="meter">'+label+'<b>'+esc(pct(p))+'</b><div class="bar'+(num(p)?"":" muted-bar")+'"><i class="'+(num(p)?barCls(p):"")+'" style="width:'+(num(p)?p:0)+'%"></i></div></div>'}


/* ---------- 详情页服务可用率状态卡片 (过去 24 小时 / 48 柱滑动跟随弹窗) ---------- */
function utCls(r){return r >= 0.95 ? "up" : r >= 0.5 ? "warn" : "down"}
function renderUptimeCard(nodeId, online) {
 var data = S.statusMap[nodeId];
 if (!data) {
  // 失败后 30 秒内不重试，否则每个实时帧都会再打一次接口
  if (Date.now() - (S.statusAt[nodeId] || 0) > 30000) loadNodeStatus(nodeId);
  var emptyBars = "";
  for (var i = 0; i < 48; i++) {
   emptyBars += '<i class="status-bar ' + (online ? 'up' : 'blank') + '" style="opacity:' + (online ? 0.35 : 0.2) + '"></i>';
  }
  return '<div class="uptime-card" id="uptimeCard"><div class="uptime-head"><span class="uptime-title"><span class="dot ' + (online?'':'off') + '"></span>服务可用性 (过去 24 小时)</span><span class="uptime-rate">加载中</span></div><div class="uptime-bars-wrap" id="uptimeWrap"><div class="status-bars">' + emptyBars + '</div></div><div class="uptime-foot"><span>24 小时前</span><span>现在</span></div></div>';
 }
 var bars = "", sum = 0, count = 0;
 data.forEach(function(item, idx) {
  var r = item.rate;
  sum += r; count++;
  bars += '<i class="status-bar ' + utCls(r) + '"></i>';
 });
 var avg = count > 0 ? (sum / count * 100) : 100;
 var avgStr = (avg >= 99.95 && avg < 100) ? "99.9%" : (avg >= 100 ? "100%" : avg.toFixed(1) + "%");
 return '<div class="uptime-card" id="uptimeCard">'+
  '<div class="uptime-head"><span class="uptime-title"><span class="dot ' + (online?'':'off') + '"></span>服务可用性 (过去 24 小时)</span><span class="uptime-rate">' + avgStr + ' 正常</span></div>'+
  '<div class="uptime-bars-wrap" id="uptimeWrap">'+
   '<div class="uptime-cursor" id="uptimeCursor"></div>'+
   '<div class="uptime-tooltip" id="uptimeTooltip"></div>'+
   '<div class="status-bars" id="uptimeBars">' + bars + '</div>'+
  '</div>'+
  '<div class="uptime-foot"><span>24 小时前</span><span>现在</span></div></div>';
}
function loadNodeStatus(nodeId) {
 if (S.loadingStatus[nodeId]) return;
 S.loadingStatus[nodeId] = true;
 var done = function(){ S.loadingStatus[nodeId] = false; S.statusAt[nodeId] = Date.now(); };
 api("/api/nodes/" + nodeId + "/metrics?hours=24&points=48&series=metrics").then(function(d) {

   result.push({ ts: r.ts, time: mdhm(r.ts), rate: rate });
  });
  S.statusMap[nodeId] = result;

/* 可用率卡片单独占一个容器：实时帧只在内容真变化时重写，悬停中的游标和提示不会被冲掉 */
function renderUptime(n) {
 if (setHTML($("#dUptime"), renderUptimeCard(n.id, n.online))) bindUptimeTracker();
}
var uptimeHideTimer = null;
function bindUptimeTracker() {
 var wrap = document.getElementById("uptimeWrap");
 if (!wrap) return;
 var cur = document.getElementById("uptimeCursor");
 var tip = document.getElementById("uptimeTooltip");
 var barsBox = document.getElementById("uptimeBars");
 var data = S.statusMap[S.detailId];
 if (!data || !data.length || !barsBox) return;

 function track(e) {
  clearTimeout(uptimeHideTimer);
  var rect = wrap.getBoundingClientRect();
  var x = e.clientX - rect.left;
  x = Math.max(0, Math.min(x, rect.width));
  var idx = Math.floor(x / rect.width * data.length);
  idx = Math.max(0, Math.min(idx, data.length - 1));
  var item = data[idx];

  // 高亮柱条
  barsBox.classList.add("dim");
  var allBars = barsBox.children;
  for (var i = 0; i < allBars.length; i++) {
   allBars[i].classList.toggle("active", i === idx);
  }

  // 标线和弹窗跟随
  var barEl = allBars[idx];
  var barCenterX = barEl ? (barEl.offsetLeft + barEl.offsetWidth / 2) : x;

  if (cur) {
   cur.style.left = barCenterX + "px";
   cur.style.display = "block";
  }
  if (tip) {
   var ratePct = Math.round(item.rate * 100);
   var statusText = item.rate >= 0.95 ? "正常运行" : (item.rate >= 0.5 ? "部分中断" : "完全离线");
   tip.innerHTML = '<div class="ut-t">' + esc(item.time) + '</div><div class="ut-r"><i class="ut-dot ' + utCls(item.rate) + '"></i>可用率 ' + ratePct + '% · ' + statusText + '</div>';
   tip.style.display = "block";

   var tw = tip.offsetWidth;
   var clampedX = Math.max(tw / 2 + 2, Math.min(rect.width - tw / 2 - 2, barCenterX));
   tip.style.left = clampedX + "px";
  }
 }

 function leave() {
  uptimeHideTimer = setTimeout(function() {
   if (cur) cur.style.display = "none";
   if (tip) tip.style.display = "none";
   if (barsBox) {
    barsBox.classList.remove("dim");
    var allBars = barsBox.children;
    for (var i = 0; i < allBars.length; i++) allBars[i].classList.remove("active");
   }
  }, 1200);
 }

 // Pointer Events 已覆盖触摸，不再另绑 touch 事件（否则每次触摸会处理两遍）
 wrap.onpointerdown = track;
 wrap.onpointermove = track;
 wrap.onpointerleave = leave;
 wrap.onpointerup = leave;
 wrap.onpointercancel = leave;
}

/* ---------- 削峰平滑算法 (MAD despike + 滑动均值) ---------- */
function despike(pts, windowSize) {
 if (!pts || pts.length < 5) return pts;
 var w = windowSize || 9, half = Math.floor(w / 2);
 var res = [];
 for (var i = 0; i < pts.length; i++) {
  var p = pts[i];
  if (!num(p[1])) { res.push(p); continue; }
  var start = Math.max(0, i - half), end = Math.min(pts.length, i + half + 1);
  var vals = [];
  for (var k = start; k < end; k++) {
   if (num(pts[k][1])) vals.push(pts[k][1]);
  }
  if (vals.length < 3) { res.push(p); continue; }
  vals.sort(function(a,b){return a-b});
  var med = vals[Math.floor(vals.length / 2)];
  var devs = vals.map(function(v){return Math.abs(v - med)}).sort(function(a,b){return a-b});
  var mad = devs[Math.floor(devs.length / 2)] || 1e-6;
  var z = Math.abs(p[1] - med) / (1.4826 * mad);
  var val = z > 3.8 ? med : p[1];
  res.push(p.length > 2 ? [p[0], val, p[2]] : [p[0], val]);
 }
 return res;
}
function movAvg(pts, w) {
 if (!pts || pts.length < 3) return pts;
 var half = Math.floor((w || 5) / 2);
 var res = [];
 for (var i = 0; i < pts.length; i++) {
  var p = pts[i];
  if (!num(p[1])) { res.push(p); continue; }
  var start = Math.max(0, i - half), end = Math.min(pts.length, i + half + 1);
  var sum = 0, count = 0;
  for (var k = start; k < end; k++) {
   if (num(pts[k][1])) { sum += pts[k][1]; count++; }
  }
  var val = count > 0 ? (sum / count) : p[1];
  res.push(p.length > 2 ? [p[0], val, p[2]] : [p[0], val]);
 }
 return res;
}
function fillShortGaps(pts, maxGapPoints) {
 if (!pts || pts.length < 3) return pts;
 var limit = maxGapPoints || 3;
 var res = [];
 for (var i = 0; i < pts.length; i++) {
  var p = pts[i];
  if (num(p[1])) {
   res.push([p[0], p[1], p[2]]);
  } else {
   // 往前找最近有效点，往后找最近有效点
   var prev = null, next = null, nextIdx = -1;
   for (var k = i - 1; k >= 0; k--) {
    if (num(pts[k][1])) { prev = pts[k]; break; }
   }
   for (var k = i + 1; k < pts.length; k++) {
    if (num(pts[k][1])) { next = pts[k]; nextIdx = k; break; }
   }
   if (prev && next && (nextIdx - i) <= limit) {
    // 短时单点或双点丢包中断：线性插值连通，保持曲线连续
    var ratio = (p[0] - prev[0]) / (next[0] - prev[0]);
    var interpVal = prev[1] + (next[1] - prev[1]) * ratio;
    res.push([p[0], interpVal, p[2]]);
   } else {
    res.push(p);
   }
  }
 }
 return res;
}
function smoothPts(pts) {
 var filled = fillShortGaps(pts, 3);
 if (!S.smooth) return filled;
 return movAvg(despike(filled, 9), 5);
}

  var avgLoss = num(lossMap[t]) ? lossMap[t] : (num(lossMap[String(t)]) ? lossMap[String(t)] : 0);
  var lossBadge = "";
  if (avgLoss > 0) {
   var cls = avgLoss >= 5 ? "bad" : "warn";
   lossBadge = '<span class="loss-badge ' + cls + '">丢包 ' + (avgLoss >= 1 ? avgLoss.toFixed(1) : avgLoss.toFixed(2)) + '%</span>';
  } else {
   lossBadge = '<span class="loss-badge zero">无丢包</span>';
  }
  var rawPts = ping.filter(function(p){return p.task_id===t}).map(function(p){
   var lat = num(p.latency) && p.latency > 0 ? p.latency : null;
   var l = num(p.loss) ? p.loss : (lat === null ? 100 : 0);
   return [p.ts, lat, l];
  });
  var smoothed = smoothPts(rawPts);
  for (var i = 0; i < smoothed.length; i++) {
   if (rawPts[i]) smoothed[i][2] = rawPts[i][2];
  }
  return {
   id: t,
   name: (d.probes && d.probes[t]) || ("监控 " + t),
   color: pal[idx % pal.length],
   sub: lossBadge,
   pts: smoothed
  };
 });
 var pCount = ids.length;
 var hiddenCount = Object.keys(S.hiddenProbes).filter(function(k){return S.hiddenProbes[k]}).length;
 var toggleAllTxt = hiddenCount > 0 ? "全部显示" : "全不选";
 var extraHdr = pCount > 1 ? '<div class="chart-toggles"><button class="chart-toggle" id="pingToggleAll">' + toggleAllTxt + '</button></div>' : "";
 var anyLoss = pingSeries.some(function(s){
  if(S.hiddenProbes[s.id])return false;
  return s.pts.some(function(p){return num(p[2])&&p[2]>0});
 });
 var cfg = {
  axis:function(v){return Math.round(v)+"ms"},
  fmt:function(v){return Math.round(v)+" ms"},
  step:step,
  showLoss:true,
  subTitle:anyLoss?"折线为延迟 · 柱状为丢包率":""
 };
 if(target){
  chartCard(target,"线路延迟与丢包 (Ping)",pingSeries,cfg,extraHdr,"pingChartCard",defer);
  return;
 }
 var detailEl=$("#detail"),savedTop=detailEl?detailEl.scrollTop:0,savedWinY=window.scrollY;
 var oldCard = document.getElementById("pingChartCard");
 var newCard = chartCard(null,"线路延迟与丢包 (Ping)",pingSeries,cfg,extraHdr,"pingChartCard",true);
 if(oldCard && oldCard.parentNode){
  charts = charts.filter(function(c){return !oldCard.contains(c.host)});
  oldCard.parentNode.replaceChild(newCard, oldCard);
 }else{
  var netBox=$("#dNetCharts");if(netBox)netBox.appendChild(newCard);
 }
 redrawCharts();
 if(detailEl && detailEl.scrollTop!==savedTop)detailEl.scrollTop=savedTop;
 if(!desktop() && Math.abs(window.scrollY-savedWinY)>1)window.scrollTo(0,savedWinY);
}

function loadHistory(){
 var id=S.detailId,seq=++S.seq;if(id===null)return Promise.resolve();
 return api("/api/nodes/"+id+"/metrics?hours="+S.hours+"&points=360").then(function(d){
  if(seq!==S.seq||S.detailId!==id)return;
  S.lastHistoryData=d;
  renderHistory();
 }).catch(function(e){
  if(seq!==S.seq)return;
  var b=$("#dResCharts");if(b)b.innerHTML='<div class="chart-card"><div class="nodata">'+esc(e.message||"历史数据加载失败")+'</div></div>';
 })}
/* 只用缓存数据重画：离屏构建后原子替换，避免定时刷新清空容器导致滚动条弹回顶部 */
function renderHistory(){
  var d=S.lastHistoryData,id=S.detailId;if(!d||id===null)return;
  var resBox=$("#dResCharts"),netBox=$("#dNetCharts");
  if(!resBox||!netBox)return;
  var detailEl=$("#detail"),savedTop=detailEl?detailEl.scrollTop:0,savedWinY=window.scrollY;
  var resFrag=document.createDocumentFragment(),netFrag=document.createDocumentFragment();
  charts=[];
  var rows=Array.isArray(d.metrics)?d.metrics:[],step=d.step||60;
  function ser(name,key,f){var raw=rows.map(function(r){return[r.ts,num(r[key])?(f?f(r[key]):r[key]):null]});return{name:name,pts:smoothPts(raw)}}
  var n=find(id)||{},memT=n.mem_total;

  var isDark = document.documentElement.getAttribute("data-theme") === "dark";

  /* --- 1. 系统资源：CPU (暖赭 / 砖红) --- */
  var cpuAvg=ser("平均","cpu"),cpuMax=ser("峰值","cpu_max");
  cpuAvg.color = isDark ? "#dca457" : "#b86e1e";
  cpuMax.color = isDark ? "#d66d6d" : "#b83a3a";
  cpuMax.stat = "max";
  var cpuVals=[].concat(cpuAvg.pts,cpuMax.pts).map(function(p){return p[1]}).filter(num);
  var cpuPeak=cpuVals.length?Math.max.apply(null,cpuVals):1;
  var cpuCfg={axis:function(v){return(v<10&&v>0?v.toFixed(1):Math.round(v))+"%"},fmt:function(v){return v.toFixed(1)+"%"},step:step};
  if(S.cpuScale==="fit"){
   var topV=niceMax(Math.max(1,cpuPeak*1.15));
   cpuCfg.max=Math.min(100,topV);
   cpuCfg.base=0;
  }else{
   cpuCfg.max=100;cpuCfg.base=0;
  }
  var cpuToggle='<div class="chart-toggles"><button class="chart-toggle'+(S.cpuScale==="fit"?" active":"")+'" data-toggle="cpu:fit">自适应</button><button class="chart-toggle'+(S.cpuScale==="abs"?" active":"")+'" data-toggle="cpu:abs">0-100%</button></div>';
  chartCard(resFrag,"CPU 占用",[cpuAvg,cpuMax],cpuCfg,cpuToggle,null,true);

  /* --- 2. 系统资源：内存 (松针绿 / 藕灰紫) --- */
  var memSer={name:"内存",pts:smoothPts(rows.map(function(r){return[r.ts,ratio(r.mem_used,memT)]})),color:isDark?"#52b788":"#2e8555"};
  var swapSer=n.swap_total>0?{name:"交换",pts:rows.map(function(r){return[r.ts,ratio(r.swap_used,n.swap_total)]}),color:isDark?"#aa8fdc":"#6e52a8"}:null;
  var memSeries=[memSer].concat(swapSer?[swapSer]:[]);
  var memVals=[].concat(memSer.pts,swapSer?swapSer.pts:[]).map(function(p){return p[1]}).filter(num);
  var memCfg={fmt:function(v){return v.toFixed(1)+"%"},step:step};
  if(S.memScale==="fit"&&memVals.length){
   var minM=Math.min.apply(null,memVals),maxM=Math.max.apply(null,memVals);
   var spanM=Math.max(2,maxM-minM);
   memCfg.base=Math.max(0,Math.floor(minM-spanM*0.25));
   memCfg.max=Math.min(100,Math.ceil(maxM+spanM*0.25));
   if(memCfg.max<=memCfg.base)memCfg.max=Math.min(100,memCfg.base+4);
  }else{
   memCfg.base=0;memCfg.max=100;
  }
  memCfg.axis=function(v){return(memCfg.max-memCfg.base<10?v.toFixed(1):Math.round(v))+"%"};
  var memToggle='<div class="chart-toggles"><button class="chart-toggle'+(S.memScale==="fit"?" active":"")+'" data-toggle="mem:fit">自适应</button><button class="chart-toggle'+(S.memScale==="abs"?" active":"")+'" data-toggle="mem:abs">0-100%</button></div>';
  chartCard(resFrag,"内存使用",memSeries,memCfg,memToggle,null,true);

  /* --- 3. 系统资源：磁盘使用率 (石青) --- */
  /* 历史接口只有已用容量，按节点当前总容量换算使用率；缺失值保留为空。 */
  var diskTotal=n.disk_total||(n.metrics&&n.metrics.disk_total);
  var diskSer={name:"磁盘",pts:smoothPts(rows.map(function(r){return[r.ts,ratio(r.disk_used,diskTotal)]})),color:isDark?"#56b3b0":"#1f7a78"};
  var diskVals=diskSer.pts.map(function(p){return p[1]}).filter(num);
  var diskCfg={fmt:function(v){return v.toFixed(1)+"%"},step:step,subTitle:num(diskTotal)&&diskTotal>0?"总容量 "+bytes(diskTotal):""};
  if(S.diskScale==="fit"&&diskVals.length){
   var minD=Math.min.apply(null,diskVals),maxD=Math.max.apply(null,diskVals);
   var spanD=Math.max(2,maxD-minD);
   diskCfg.base=Math.max(0,Math.floor(minD-spanD*0.3));
   diskCfg.max=Math.min(100,Math.ceil(maxD+spanD*0.3));
   if(diskCfg.max<=diskCfg.base)diskCfg.max=Math.min(100,diskCfg.base+4);
  }else{
   diskCfg.base=0;diskCfg.max=100;
  }
  diskCfg.axis=function(v){return(diskCfg.max-diskCfg.base<10?v.toFixed(1):Math.round(v))+"%"};
  var diskToggle='<div class="chart-toggles"><button class="chart-toggle'+(S.diskScale==="fit"?" active":"")+'" data-toggle="disk:fit">自适应</button><button class="chart-toggle'+(S.diskScale==="abs"?" active":"")+'" data-toggle="disk:abs">0-100%</button></div>';
  chartCard(resFrag,"磁盘使用率",[diskSer],diskCfg,diskToggle,null,true);

  /* --- 4. 系统资源：连接数与进程数 (青川蓝 / 暖赭 / 石青虚线) --- */
  var tcpSer=ser("TCP","tcp"),udpSer=ser("UDP","udp"),procsSer=ser("进程","procs");
  tcpSer.color=isDark?"#88b5e8":"#2d639b";
  procsSer.color=isDark?"#dca457":"#b86e1e";
  udpSer.color=isDark?"#56b3b0":"#1f7a78";
  udpSer.dash=[4,3];
  var connSeries=[tcpSer,udpSer,procsSer].filter(function(s){return s.pts.some(function(p){return num(p[1])})});
  var connVals=[];
  connSeries.forEach(function(s){s.pts.forEach(function(p){if(num(p[1]))connVals.push(p[1])})});
  var connPeak=connVals.length?Math.max.apply(null,connVals):0;
  var connMax=Math.max(4,niceMax(connPeak*1.12||4));
  var connCfg={
   axis:function(v){return v>=1000?(v/1000).toFixed(1).replace(/\.0$/,"")+"k":String(Math.round(v))},
   fmt:function(v){return String(Math.round(v))},
   step:step,base:0,max:connMax
  };
  chartCard(resFrag,"连接数与进程数",connSeries,connCfg,null,null,true);

  /* --- 5. 网络监控：实时带宽 (青川蓝 / 豆青绿 / 雅致淡紫与麦金) --- */
  var rxSer=ser("下行","net_rx"),txSer=ser("上行","net_tx");
  var rxPeakSer=ser("下行峰值","net_rx_max"),txPeakSer=ser("上行峰值","net_tx_max");
  rxSer.color = cssv("--accent"); // 主曲线跟随强调色，换色后图表也一起变
  txSer.color = isDark ? "#52b788" : "#2e8555";
  rxPeakSer.color = isDark ? "#9faae0" : "#5a68a5";
  txPeakSer.color = isDark ? "#dca457" : "#b86e1e";
  rxPeakSer.stat = "max";
  txPeakSer.stat = "max";
  chartCard(netFrag,"带宽与网络速率",[rxSer,txSer,rxPeakSer,txPeakSer],{axis:axisBytes,niceMax:niceBytesMax,fmt:speed,step:step},null,null,true);

  renderPingChart(netFrag,true);
  swapContent(resBox,resFrag);
  swapContent(netBox,netFrag);
  redrawCharts();
  if(detailEl && detailEl.scrollTop!==savedTop)detailEl.scrollTop=savedTop;
  if(!desktop() && Math.abs(window.scrollY-savedWinY)>1)window.scrollTo(0,savedWinY);
}

/* ---------- 实时数据 ---------- */
function setNodes(d){
 if(!d||!Array.isArray(d.nodes))return;
 S.nodes=d.nodes;S.admin=!!d.admin;S.loaded=true;S.err="";S.lastFrame=Date.now();renderAll()}
function poll(){
 if(document.hidden)return Promise.resolve();
 return api("/api/nodes").then(function(d){if(document.hidden)return;setNodes(d)}).catch(function(e){if(document.hidden)return;S.err="连接异常，显示的是旧数据";S.loaded=true;renderAll()})}
function frameText(data){
 if(typeof data==="string")return Promise.resolve(data);
 return new Response(data.stream().pipeThrough(new DecompressionStream("gzip"))).text()}
var chain=Promise.resolve(),cdTimer=null;
function connect(){
 clearInterval(cdTimer);
 if(document.hidden||S.ws)return;
 var ws;
 try{ws=new WebSocket((location.protocol==="https:"?"wss":"ws")+"://"+location.host+"/api/ws"+(typeof DecompressionStream==="function"?"?gzip":""))}catch(e){retry();return}
 S.ws=ws;
 ws.onopen=function(){
  S.wsFails=0;S.err="";
  renderLive();
 };
 ws.onmessage=function(ev){
  chain=chain.then(function(){return frameText(ev.data)}).then(function(t){
   if(S.ws!==ws)return;
   setNodes(JSON.parse(t));
  }).catch(function(){});
 };
 ws.onclose=ws.onerror=function(){
  if(S.ws===ws){
   S.ws=null;S.wsFails++;
   retry();
  }
 };
}
function retry(){
 clearInterval(cdTimer);
 var delay = Math.min(30000, 3000 * Math.pow(1.6, Math.min(S.wsFails, 5)));
 var remain = Math.ceil(delay / 1000);
S.err = "连接已断开，" + remain + " 秒后自动重连...";
 renderLive();
 cdTimer = setInterval(function(){
  remain--;
  if(remain <= 0){
   clearInterval(cdTimer);
   S.err = "正在重新连接...";
   renderLive();
   connect();
  } else {
   S.err = "连接已断开，" + remain + " 秒后自动重连...";
   renderLive();
  }
 }, 1000);
}
function renderLive(){
 var live=$("#live");if(!live)return;
 live.classList.toggle("err",!!S.err);
 $("#liveText").textContent=S.err||"实时更新中";
}
function stopWs(){clearInterval(cdTimer);var w=S.ws;S.ws=null;if(w){try{w.close()}catch(e){}}}
setInterval(function(){if(!S.ws||Date.now()-S.lastFrame>12000)poll()},5000);
setInterval(function(){if(!document.hidden&&S.detailId!==null){loadHistory();loadNodeStatus(S.detailId)}},60000);
document.addEventListener("visibilitychange",function(){if(document.hidden){stopWs()}else{poll();S.wsFails=0;connect()}});

/* ---------- 交互与路由 ---------- */
function parseRoute(){var m=/^\/node\/(\d+)/.exec(location.pathname);S.routeId=m?parseInt(m[1],10):null}
/* 手机端列表是整页滚动，进详情前记下位置，返回时还原；桌面端列表在独立滚动容器里，不受影响 */
function route(){
 var wasList=S.routeId===null;if(wasList)S.listScroll=window.scrollY;
 parseRoute();S.detailId=null;renderAll();
 window.scrollTo(0,S.routeId===null&&!wasList?S.listScroll:0)}
try{history.scrollRestoration="manual"}catch(e){}
function go(path){if(location.pathname!==path)history.pushState({},"",path);route()}
window.addEventListener("popstate",route);
document.addEventListener("click",function(e){
 var t=e.target.closest("button");if(!t)return;
 if(t.classList.contains("item")){go("/node/"+t.dataset.id)}
 else if(t.classList.contains("filter")){S.group=parseInt(t.dataset.g,10);renderAll()}
 else if(t.classList.contains("range")){S.hours=parseInt(t.dataset.h,10);renderRanges();loadHistory()}
 else if(t.dataset.toggle){
  var parts=t.dataset.toggle.split(":");
  if(parts[0]==="cpu")S.cpuScale=parts[1];
  else if(parts[0]==="mem")S.memScale=parts[1];
  else if(parts[0]==="disk")S.diskScale=parts[1];
  renderHistory();
 }
 else if(t.classList.contains("detail-tab")){
  switchDetailTab(t.dataset.tab);
 }
 else if(t.classList.contains("legend-item")&&t.dataset.probeId){
  var pid = t.dataset.probeId;
  if(S.hiddenProbes[pid]) delete S.hiddenProbes[pid];
  else S.hiddenProbes[pid] = true;
  renderPingChart();
 }
 else if(t.id==="pingToggleAll"){
  var d = S.lastHistoryData;
  if(d && Array.isArray(d.ping)){
   var pids = [];
   d.ping.forEach(function(p){if(pids.indexOf(p.task_id)<0)pids.push(p.task_id)});
   var hiddenCount = Object.keys(S.hiddenProbes).filter(function(k){return S.hiddenProbes[k]}).length;
   if(hiddenCount > 0){
    S.hiddenProbes = {};
   } else {
    pids.forEach(function(id){S.hiddenProbes[id] = true});
   }
   renderPingChart();
  }
 }
 else if(t.id==="smoothToggle"){
  S.smooth = !S.smooth;
  var b1 = $("#smoothToggle");
  if(b1){
   b1.textContent = "削峰平滑: " + (S.smooth ? "开" : "关");
   b1.classList.toggle("active", S.smooth);
  }
  renderHistory();
 }
 else if(t.classList.contains("sort-btn")){
  var wrap=t.closest(".sort-wrap"),wasOpen=wrap&&wrap.classList.contains("open");
  closeSortMenus();
  if(wrap&&!wasOpen){
   wrap.classList.add("open");
   t.setAttribute("aria-expanded","true");
  }
 }
 else if(t.classList.contains("sort-opt")){
  onSortChange(t.dataset.sort);
  closeSortMenus();
 }
 else if(t.id==="back"){go("/")}});
document.addEventListener("click",function(e){
 if(!e.target.closest(".sort-wrap"))closeSortMenus();
});
function sortLabel(k){for(var i=0;i<SORT_OPTS.length;i++)if(SORT_OPTS[i].k===k)return SORT_OPTS[i].label;return"默认排序"}
function closeSortMenus(){
 document.querySelectorAll(".sort-wrap.open").forEach(function(w){
  w.classList.remove("open");
  var b=w.querySelector(".sort-btn");
  if(b)b.setAttribute("aria-expanded","false");
 });
}
function renderSortMenus(){
 var icon='<svg viewBox="0 0 24 24"><path d="M7 6v12M7 18l-3-3M7 18l3-3M17 18V6M17 6l-3 3M17 6l3 3"/></svg>';
 var caret='<svg class="sort-caret" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
 var check='<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
 var optsHtml=SORT_OPTS.map(function(o){
  var on=o.k===S.sort;
  return '<button class="sort-opt'+(on?' active':'')+'" type="button" role="option" aria-selected="'+(on?'true':'false')+'" data-sort="'+o.k+'"><span>'+esc(o.label)+'</span>'+check+'</button>';
 }).join("");
 ["#sortWrap","#msortWrap"].forEach(function(sel){
  var el=$(sel);if(!el)return;
  var open=el.classList.contains("open");
  var active=S.sort!=="default";
  el.innerHTML='<button class="sort-btn'+(active?' active':'')+'" type="button" aria-haspopup="listbox" aria-expanded="'+(open?'true':'false')+'" aria-label="排序方式">'+icon+'<span>'+esc(sortLabel(S.sort))+'</span>'+caret+'</button>'+
   '<div class="sort-menu" role="listbox" aria-label="排序选项">'+optsHtml+'</div>';
 });
}
function onSearchInput(val){
 S.q = val;
 var q1 = $("#q"), q2 = $("#mq");
 if(q1 && q1.value !== val) q1.value = val;
 if(q2 && q2.value !== val) q2.value = val;
 renderList();
}
function onSortChange(val,save){
 if(SORTS.indexOf(val)<0)val="default";
 S.sort=val;
 if(save!==false){if(val==="default")lsDel("paper-sort");else lsSet("paper-sort",val)}
 renderSortMenus();
 renderList();
}
var qEl = $("#q"), mqEl = $("#mq");
if(qEl) qEl.addEventListener("input", function(){ onSearchInput(this.value); });
if(mqEl) mqEl.addEventListener("input", function(){ onSearchInput(this.value); });
onSortChange(lsGet("paper-sort")||"default",false);
document.addEventListener("keydown", function(e){
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 var openWrap=document.querySelector(".sort-wrap.open");
 if(openWrap){
  if(e.key==="Escape"){
   e.preventDefault();
   var btn=openWrap.querySelector(".sort-btn");
   closeSortMenus();
   if(btn)btn.focus();
   return;
  }
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
   e.preventDefault();
   var opts=Array.prototype.slice.call(openWrap.querySelectorAll(".sort-opt"));
   if(!opts.length)return;
   var curIdx=opts.indexOf(document.activeElement);
   if(curIdx<0)curIdx=SORTS.indexOf(S.sort);
   var nextIdx=e.key==="ArrowDown"?(curIdx+1)%opts.length:(curIdx-1+opts.length)%opts.length;
   opts[nextIdx].focus();
   return;
  }
 }
 var tag=document.activeElement?document.activeElement.tagName:"";
 var inInput=tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT";
 if(e.key==="Escape"&&inInput){
  if(S.q)onSearchInput("");
  document.activeElement.blur();
  return;
 }
 if(inInput)return;
 if(e.key==="/"){
  var box=desktop()?$("#q"):$("#mq");
  if(box&&box.offsetParent!==null){e.preventDefault();box.focus()}
 }else if((e.key==="ArrowDown"||e.key==="ArrowUp")&&desktop()){
  var v=visible();if(!v.length)return;
  var cur=selId(),idx=-1;
  for(var i=0;i<v.length;i++)if(v[i].id===cur){idx=i;break}
  var next=e.key==="ArrowDown"?(idx+1)%v.length:(idx-1+v.length)%v.length;
  e.preventDefault();
  go("/node/"+v[next].id);
  var item=document.querySelector('.item[data-id="'+v[next].id+'"]');
  if(item&&item.scrollIntoView)item.scrollIntoView({block:"nearest"});
 }
});

/* ---------- 启动 ---------- */
function boot(){
 parseRoute();applyTheme();
 var cfgP=api("/api/themes/"+SHORT+"/config").catch(function(){return{}});
 var meP=api("/api/me").catch(function(){return{}});
 var nodesP=api("/api/nodes").catch(function(e){S.err=e.message||"加载失败";return null});
 Promise.all([cfgP,meP,nodesP]).then(function(r){
  var c=r[0]||{},me=r[1]||{};
  if(typeof c.notice==="string")S.cfg.notice=c.notice;
  if(c.mode==="auto"||c.mode==="light"||c.mode==="dark")S.cfg.mode=c.mode;
  if(ACCENTS.indexOf(c.accent)>=0){S.cfg.accent=c.accent;lsSet("paper-accent",c.accent)}
  applyAccent(S.cfg.accent);
  if(num(me.history_days))S.me.history_days=me.history_days;
  var name=(typeof me.site_name==="string"?me.site_name:"").replace(/\s+/g," ").trim();
  if(name){$("#siteName").textContent=name;document.title=name}
  var nb=$("#notice");if(S.cfg.notice){nb.textContent=S.cfg.notice;nb.hidden=false}
  applyTheme();
  if(r[2])setNodes(r[2]);else{S.loaded=true;renderAll()}
  connect()})}
boot();
})();
</script>
