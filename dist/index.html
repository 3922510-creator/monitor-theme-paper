<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>探针</title>
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#f4f5f7;--paper:#ffffff;--text:#2e3338;--muted:#828892;--border:#e2e5e9;--hover:#f7f8fa;--selected:#edf3f9;--accent:#2d639b;--accent-line:#d2deeb;--accent-surface:#f5f8fc;--warn:#b8751e;--bad:#c24138;--track:#e8ecf1;color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
[data-theme=dark]{--bg:#14171a;--paper:#1c2024;--text:#dce0e5;--muted:#88919b;--border:#2a3036;--hover:#23282e;--selected:#222c38;--accent:#88b5e8;--accent-line:#2f3f52;--accent-surface:#1c2530;--warn:#d49746;--bad:#d96b64;--track:#2a3036;color-scheme:dark}

/* 强调色主题方案 (低饱和柔和调) */
html[data-accent="emerald"]{--accent:#1f7a59;--accent-line:#c5ebd8;--accent-surface:#f2faf6;--selected:#e1f5eb}
html[data-theme="dark"][data-accent="emerald"]{--accent:#52b788;--accent-line:#234a38;--accent-surface:#182b22;--selected:#1e382b}

html[data-accent="amber"]{--accent:#b86e1e;--accent-line:#fae1bf;--accent-surface:#fdf8f0;--selected:#fcf0df}
html[data-theme="dark"][data-accent="amber"]{--accent:#dca457;--accent-line:#4f371b;--accent-surface:#2d2113;--selected:#3b2b18}

html[data-accent="purple"]{--accent:#6e52a8;--accent-line:#e0d7f5;--accent-surface:#f7f4fc;--selected:#eee8fa}
html[data-theme="dark"][data-accent="purple"]{--accent:#aa8fdc;--accent-line:#433261;--accent-surface:#281e3a;--selected:#34264d}

html[data-accent="zinc"]{--accent:#3d444d;--accent-line:#d8dce2;--accent-surface:#f5f6f8;--selected:#eaedf2}
html[data-theme="dark"][data-accent="zinc"]{--accent:#b0b8c4;--accent-line:#363d47;--accent-surface:#1f242b;--selected:#282f38}

html[data-accent="rose"]{--accent:#b83a54;--accent-line:#f8d1da;--accent-surface:#fdf4f6;--selected:#fae4e9}
html[data-theme="dark"][data-accent="rose"]{--accent:#d66d84;--accent-line:#54212e;--accent-surface:#30151c;--selected:#421b25}

*{box-sizing:border-box}
body{margin:0;font-size:14px;min-height:100dvh}
button,input{font:inherit}
button{cursor:pointer;color:inherit;background:none;border:0}
a{color:inherit}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button:hover{background:var(--hover)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
@media(min-width:821px){
 html,body{height:100%;overflow:hidden}
 body{display:flex;flex-direction:column}
 .wrap{max-width:1400px;width:100%;margin:0 auto;padding:10px 16px;height:100dvh;display:flex;flex-direction:column;box-sizing:border-box}
 .notice{margin:0 0 8px;padding:8px 14px;background:var(--accent-surface);border:1px solid var(--accent-line);border-radius:6px;color:var(--accent);font-size:12px;white-space:pre-wrap;word-break:break-word;flex-shrink:0}
 .app{background:var(--paper);border:1px solid var(--border);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:0;box-shadow:0 4px 20px rgba(0,0,0,.03)}
 .app-header{flex-shrink:0}
 .summary{flex-shrink:0;padding:16px 28px}
 .toolbar{flex-shrink:0;min-height:56px}
 .layout{flex:1;min-height:0;display:grid;grid-template-columns:360px minmax(0,1fr);height:100%}
 .list-col{height:100%;overflow-y:auto;border-right:1px solid var(--border);position:static;scrollbar-width:none;-ms-overflow-style:none}
 .list-col::-webkit-scrollbar{display:none}
 .detail{height:100%;overflow-y:auto;padding:24px 32px 32px;min-width:0;scrollbar-width:none;-ms-overflow-style:none}
 .detail::-webkit-scrollbar{display:none}
 .footer{flex-shrink:0}
}
@media(max-width:820px){
 .wrap{max-width:1140px;margin:12px auto 40px;padding:0 12px}
 .notice{margin:0 0 10px;padding:10px 16px;background:var(--accent-surface);border:1px solid var(--accent-line);border-radius:6px;color:var(--accent);font-size:13px;white-space:pre-wrap;word-break:break-word}
 .app{background:var(--paper);border:1px solid var(--border);border-radius:6px;overflow:hidden}
}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:12px 28px;border-bottom:1px solid var(--border);gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:22px;height:22px;border-radius:4px}
h1{font-size:18px;font-weight:600;margin:0;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-button{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px}
@keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
.spinning svg { animation: spin 0.65s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

.plain-button{min-height:44px;padding:0 12px;border-radius:4px;display:inline-flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--border);text-decoration:none}
.plain-button:hover{background:var(--hover)}
.summary{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;gap:24px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.sum-main{display:flex;align-items:center;gap:20px}
.sum-label{font-size:13px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;flex-shrink:0}
.dot.off{background:var(--muted);opacity:.6}
.big{font:500 25px/1.4 ui-monospace,"SFMono-Regular",Consolas,monospace;letter-spacing:-.5px;white-space:nowrap}
.big small{font-size:14px;color:var(--muted);letter-spacing:0}
.sum-meta{display:flex;gap:28px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sum-meta div{display:flex;flex-direction:column;gap:2px}
.sum-meta strong{font:500 15px/1.4 ui-monospace,"SFMono-Regular",Consolas,monospace;color:var(--text)}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;min-height:66px;border-bottom:1px solid var(--border);gap:20px}
.filters{display:flex;gap:16px;align-self:stretch;overflow-x:auto;scrollbar-width:none;min-width:0}
.filters::-webkit-scrollbar{display:none}
.filter{padding:0 8px;border-bottom:2px solid transparent;border-radius:0;white-space:nowrap;font-size:13px;color:var(--muted);min-height:44px}
.filter.active{border-color:var(--accent);color:var(--accent);font-weight:550}
.filter span{margin-left:6px;font-size:12px;color:var(--muted);background:var(--selected);border-radius:3px;padding:1px 6px}
.filter.active span{color:var(--accent)}
.tools{display:flex;align-items:center;gap:10px;min-width:0}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:4px;padding:0 10px;width:220px;min-width:0;color:var(--muted)}
.search svg{width:16px;height:16px}
.search input{width:100%;min-height:44px;min-width:0;border:0;background:transparent;color:var(--text);font-size:13px}
.search input::placeholder{color:var(--muted)}
/* layout handled by media queries */
.list-heading{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:16px 22px;border-bottom:1px solid var(--border)}
.item{display:block;width:100%;text-align:left;padding:14px 22px 14px 20px;border-bottom:1px solid var(--border);border-left:2px solid transparent;border-radius:0}
.item.selected{background:var(--selected);border-left-color:var(--accent)}
.item .r1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.item .name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.selected .name{color:var(--accent)}
.st{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.st.bad{color:var(--bad)}
.item .r2{margin-top:6px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc{display:inline-block;font:600 11px/1 ui-monospace,Consolas,monospace;font-size:12px;padding:2px 5px;border:1px solid var(--border);border-radius:3px;margin-right:6px;color:var(--text);background:var(--paper)}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.uptime-card{border:1px solid var(--border);border-radius:4px;padding:12px 16px;margin-top:14px;background:var(--paper);position:relative}
.uptime-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.uptime-title{font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.uptime-title .dot{width:6px;height:6px}
.uptime-rate{font:600 13px ui-monospace,Consolas,monospace;color:var(--accent)}
.uptime-bars-wrap{position:relative;width:100%;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:crosshair;padding:4px 0}
.status-bars{display:flex;align-items:flex-end;gap:3px;height:24px;width:100%;pointer-events:none}
.status-bar{flex:1;height:22px;background:var(--track);border-radius:2px;position:relative;transition:opacity .15s}
.status-bar.up{background:#3cb371}
.status-bar.warn{background:#dca457}
.status-bar.down{background:#d66d6d}
.status-bar.empty{background:var(--track);opacity:.35}
.status-bar.active{opacity:1;filter:brightness(1.25);transform:scaleY(1.15)}
.status-bars.dim .status-bar:not(.active){opacity:.4}
.uptime-cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none;display:none;z-index:2;border-radius:1px}
.uptime-tooltip{position:absolute;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--paper);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.15);pointer-events:none;white-space:nowrap;display:none;z-index:3;line-height:1.4}
.uptime-tooltip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-4px;border:4px solid transparent;border-top-color:var(--border)}
.uptime-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}

.meter{font-size:12px;color:var(--muted)}
.meter b{font-weight:400;color:var(--text);margin-left:4px;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--track);border-radius:2px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.bar i.warn{background:var(--warn)}
.bar i.bad{background:var(--bad)}
.item.offline .name,.item.offline .meters{opacity:.55}
.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13px}
/* detail handled by media queries */
.d-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.d-head h2{margin:0;font-size:20px;font-weight:600;letter-spacing:0;overflow-wrap:anywhere}
.d-time{font-size:12px;color:var(--muted);white-space:nowrap}
.d-sub{margin-top:8px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.back{display:none;align-items:center;gap:6px;min-height:44px;padding:0 10px 0 4px;margin:0 0 6px -4px;border-radius:4px;font-size:13px;color:var(--accent)}
.stats{margin-top:22px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--accent-surface);border:1px solid var(--accent-line);border-radius:4px}
.stat{padding:16px 18px;min-width:0;border-right:1px solid var(--accent-line)}
.stat:last-child{border-right:0}
.stat .lb{font-size:12px;color:var(--muted)}
.stat .v{margin-top:6px;font:500 26px/1.2 ui-monospace,"SFMono-Regular",Consolas,monospace;color:var(--accent);letter-spacing:-.5px;white-space:nowrap}
.stat .v small{font-size:13px;letter-spacing:0}
.stat .v.two{font-size:15px;line-height:1.55;letter-spacing:0}
.stat .sub{margin-top:6px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.stat .bar{background:var(--accent-line);opacity:.8}
.sec-title{margin:30px 0 10px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-title.plain{margin-top:30px}
.traffic{border:1px solid var(--border);border-radius:4px;padding:14px 18px}
.traffic .tr{display:flex;justify-content:space-between;font-size:13px;gap:10px;flex-wrap:wrap}
.traffic .tr span{color:var(--muted)}
.traffic .bar{height:5px;margin-top:10px}
.info{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.info div{display:flex;justify-content:space-between;gap:16px;padding:11px 18px;border-bottom:1px solid var(--border);font-size:13px;min-width:0}
.info div:nth-child(odd){border-right:1px solid var(--border)}
.info div:nth-last-child(-n+2){border-bottom:0}
.info.odd div:last-child{border-bottom:0;border-right:0;grid-column:1/-1}
.info dt,.info span.k{color:var(--muted);white-space:nowrap}
.info span.val{text-align:right;overflow-wrap:anywhere;min-width:0}
.ranges{display:flex;gap:4px;flex-wrap:wrap}
.range{min-height:44px;min-width:44px;padding:0 12px;border-radius:4px;font-size:13px;color:var(--muted);border:1px solid transparent}
.range.active{color:var(--accent);border-color:var(--accent-line);background:var(--accent-surface)}
.chart-card{border:1px solid var(--border);border-radius:4px;padding:14px 16px 12px;margin-bottom:12px}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.chart-header h3{margin:0;font-size:13px;font-weight:600}
.chart-toggles{display:inline-flex;border:1px solid var(--border);border-radius:4px;padding:1px;background:var(--bg)}
.chart-toggle{padding:2px 8px;font-size:11px;min-height:22px;border-radius:3px;color:var(--muted);cursor:pointer;background:transparent;border:0;line-height:1.2}
.chart-toggle.active{color:var(--accent);background:var(--paper);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-tabs{display:flex;gap:20px;border-bottom:1px solid var(--border);margin:20px 0 0}
.detail-tab{padding:8px 4px 10px;border-bottom:2px solid transparent;font-size:14px;color:var(--muted);cursor:pointer;font-weight:500;border-radius:0;min-height:36px}
.detail-tab:hover{color:var(--text);background:transparent}
.detail-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab-content{display:none}
.tab-content.active{display:block}
@media(max-width:980px){.charts-grid{grid-template-columns:1fr}}
.chart-card h3{margin:0 0 4px;font-size:13px;font-weight:600}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.legend b{font-weight:400;color:var(--text);margin-left:5px;font-variant-numeric:tabular-nums}
.chart{position:relative;height:170px;touch-action:pan-y}
.chart canvas{width:100%;height:100%;display:block}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--paper);border:1px solid var(--border);border-radius:4px;padding:7px 10px;font-size:12px;line-height:1.6;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap;display:none;z-index:2}
.tip .t{color:var(--muted)}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.nodata{height:170px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.footer{display:flex;justify-content:space-between;gap:12px;padding:12px 28px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);flex-wrap:wrap}
.footer .live{display:flex;align-items:center;gap:8px}
.footer .live.err{color:var(--bad)}
.footer .live.err .dot{background:var(--bad)}
@media(max-width:820px){
 body{background:var(--paper)}
 .wrap{padding:0;margin:0;max-width:none}
 .notice{margin:0;border-radius:0;border-left:0;border-right:0}
 .app{border:0;border-radius:0;box-shadow:none}
 .app-header{padding:10px 16px;position:sticky;top:0;background:var(--paper);z-index:10}
 .summary{padding:14px 16px;gap:12px;display:grid;grid-template-columns:auto 1fr;align-items:center}
 .sum-main{gap:12px}
 .sum-label{font-size:12px}
 .big{font-size:22px}
 .sum-meta{gap:12px;font-size:11px;justify-content:flex-end}
 .sum-meta div{align-items:flex-end}
 .sum-meta strong{font-size:13px}
 .toolbar{padding:0 12px;flex-direction:column;align-items:stretch;min-height:auto;gap:8px;border-bottom:1px solid var(--border);padding-bottom:10px}
 .filters{width:100%;gap:6px;padding:2px 0}
 .filter{min-height:36px;font-size:12px;padding:0 6px}
 .tools{width:100%;gap:8px}
 .search{flex:1;width:auto;background:var(--bg)}
 .search input{height:36px;min-height:36px}
 .layout{display:block;min-height:0}
 .list-col{position:static;max-height:none;border-right:0}
 .item{padding:14px 16px}
 .item:active{background:var(--hover)}
 .detail{display:none;padding:16px 16px 36px}
 .app.m-detail .list-col,.app.m-detail .summary,.app.m-detail .toolbar{display:none}
 .app.m-detail .detail{display:block}
 .back{display:inline-flex;padding:0 8px;margin-bottom:10px;font-size:13px;font-weight:500}
 .d-head h2{font-size:18px}
 .stats{grid-template-columns:1fr 1fr}
 .stat{padding:12px 14px}
 .stat .v{font-size:22px}
 .stat .v.two{font-size:13px}
 .stat:nth-child(2){border-right:0}
 .stat:nth-child(-n+2){border-bottom:1px solid var(--accent-line)}
 .detail-tabs{margin:16px 0 0;gap:16px}
 .detail-tab{font-size:13px;padding:8px 2px}
 .sec-title{margin:22px 0 10px;font-size:12px}
 .sec-title.plain{margin-top:22px}
 .chart-card{padding:12px 12px 10px;margin-bottom:10px}
 .chart{height:150px}
 .info{grid-template-columns:1fr}
 .info div{padding:9px 12px;font-size:12px}
 .info div:nth-child(odd){border-right:0}
 .info div:nth-last-child(2){border-bottom:1px solid var(--border)}
 .traffic{padding:12px 14px}
 .ranges{gap:2px}
 .range{min-height:32px;min-width:32px;padding:0 8px;font-size:12px}
 .footer{padding:12px 16px}
}
</style>
</head>
<body>
<div class="wrap">
 <div class="notice" id="notice" hidden></div>
 <div class="app" id="app">
  <header class="app-header">
   <div class="brand"><img src="/favicon.svg" alt="" id="logo" onerror="this.remove()"><h1 id="siteName">探针</h1></div>
   <div class="header-actions">
    <button class="icon-button" id="themeBtn" type="button" aria-label="切换明暗"></button>
    
   </div>
  </header>
  <section class="summary" id="summary"></section>
  <div class="toolbar">
   <div class="filters" id="filters"></div>
   <div class="tools">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input id="q" type="search" placeholder="搜索节点" autocomplete="off"></label>
    <button class="icon-button" id="refresh" type="button" aria-label="刷新"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
   </div>
  </div>
  <div class="layout">
   <aside class="list-col"><div class="list-heading"><span id="listSort">按面板排序</span><span id="listCount"></span></div><div id="list"></div></aside>
   <main class="detail" id="detail"></main>
  </div>
  <footer class="footer"><div class="live" id="live"><span class="dot"></span><span id="liveText">连接中</span></div><div id="foot">点击节点查看详情</div></footer>
 </div>
</div>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var SHORT="paper";
var ICON={
 moon:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>',
 sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
 back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>'
};

var uptimeHideTimer = null;
function bindUptimeTracker() {
 var wrap = document.getElementById("uptimeWrap");
 if (!wrap) return;
 var cur = document.getElementById("uptimeCursor");
 var tip = document.getElementById("uptimeTooltip");
 var barsBox = document.getElementById("uptimeBars");
 var data = S.statusMap[S.detailId];
 if (!data || !data.length || !barsBox) return;

 function track(e) {
  clearTimeout(uptimeHideTimer);
  var rect = wrap.getBoundingClientRect();
  var clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
  var x = clientX - rect.left;
  x = Math.max(0, Math.min(x, rect.width));
  var idx = Math.floor(x / rect.width * data.length);
  idx = Math.max(0, Math.min(idx, data.length - 1));
  var item = data[idx];

  // 高亮柱条
  barsBox.classList.add("dim");
  var allBars = barsBox.children;
  for (var i = 0; i < allBars.length; i++) {
   allBars[i].classList.toggle("active", i === idx);
  }

  // 标线和弹窗跟随
  var barEl = allBars[idx];
  var barCenterX = barEl ? (barEl.offsetLeft + barEl.offsetWidth / 2) : x;

  if (cur) {
   cur.style.left = barCenterX + "px";
   cur.style.display = "block";
  }
  if (tip) {
   var ratePct = Math.round(item.rate * 100);
   var statusText = item.rate >= 0.95 ? "正常运行" : (item.rate >= 0.5 ? "部分中断" : "完全离线");
   var col = item.rate >= 0.95 ? "#10b981" : (item.rate >= 0.5 ? "#f59e0b" : "#ef4444");

   tip.style.display = "block";

   var tw = tip.offsetWidth;
   var clampedX = Math.max(tw / 2 + 2, Math.min(rect.width - tw / 2 - 2, barCenterX));
   tip.style.left = clampedX + "px";
  }
 }

 function leave() {
  uptimeHideTimer = setTimeout(function() {
   if (cur) cur.style.display = "none";
   if (tip) tip.style.display = "none";
   if (barsBox) {
    barsBox.classList.remove("dim");
    var allBars = barsBox.children;
    for (var i = 0; i < allBars.length; i++) allBars[i].classList.remove("active");
   }
  }, 1200);
 }

 wrap.onpointerdown = function(e){ track(e); };
 wrap.onpointermove = function(e){ track(e); };
 wrap.onpointerleave = function(){ leave(); };
 wrap.onpointerup = function(){ leave(); };
 wrap.ontouchstart = function(e){ track(e); };
 wrap.ontouchmove = function(e){ track(e); };
 wrap.ontouchend = function(){ leave(); };
}

/* ---------- 削峰平滑算法 (MAD despike + 滑动均值) ---------- */
function despike(pts, windowSize) {
 if (!pts || pts.length < 5) return pts;
 var w = windowSize || 9, half = Math.floor(w / 2);
 var res = [];
 for (var i = 0; i < pts.length; i++) {
  var p = pts[i];
  if (!num(p[1])) { res.push(p); continue; }
  var start = Math.max(0, i - half), end = Math.min(pts.length, i + half + 1);
  var vals = [];
  for (var k = start; k < end; k++) {
   if (num(pts[k][1])) vals.push(pts[k][1]);
  }
  if (vals.length < 3) { res.push(p); continue; }
  vals.sort(function(a,b){return a-b});
  var med = vals[Math.floor(vals.length / 2)];
  var devs = vals.map(function(v){return Math.abs(v - med)}).sort(function(a,b){return a-b});
  var mad = devs[Math.floor(devs.length / 2)] || 1e-6;
  var z = Math.abs(p[1] - med) / (1.4826 * mad);
  res.push([p[0], z > 3.8 ? med : p[1]]);
 }
 return res;
}
function movAvg(pts, w) {
 if (!pts || pts.length < 3) return pts;
 var half = Math.floor((w || 5) / 2);
 var res = [];
 for (var i = 0; i < pts.length; i++) {
  var p = pts[i];
  if (!num(p[1])) { res.push(p); continue; }
  var start = Math.max(0, i - half), end = Math.min(pts.length, i + half + 1);
  var sum = 0, count = 0;
  for (var k = start; k < end; k++) {
   if (num(pts[k][1])) { sum += pts[k][1]; count++; }
  }
  res.push([p[0], count > 0 ? (sum / count) : p[1]]);
 }
 return res;
}
function smoothPts(pts) {
 if (!S.smooth) return pts;
 return movAvg(despike(pts, 9), 5);
}

/* ---------- 图表 ---------- */
var charts=[];
var PAL={light:["#2d639b","#2e8555","#b86e1e","#b83a3a","#6e52a8","#1f7a78"],dark:["#88b5e8","#52b788","#dca457","#d66d6d","#aa8fdc","#56b3b0"]};
function palette(){return PAL[document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light"]}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function niceMax(v){if(!(v>0))return 1;var e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function makeChart(host,cfg){
 var cv=document.createElement("canvas"),tip=document.createElement("div");tip.className="tip";
 host.appendChild(cv);host.appendChild(tip);
 var c={host:host,cv:cv,tip:tip,cfg:cfg,hx:null};charts.push(c);
 cv.addEventListener("pointerdown",function(e){c.hx=e.clientX-cv.getBoundingClientRect().left;drawChart(c)});
 cv.addEventListener("pointermove",function(e){c.hx=e.clientX-cv.getBoundingClientRect().left;drawChart(c)});
 cv.addEventListener("pointerleave",function(){c.hx=null;drawChart(c)});
 cv.addEventListener("pointerup",function(){setTimeout(function(){c.hx=null;drawChart(c)},2500)});
 drawChart(c);return c}
function redrawCharts(){charts=charts.filter(function(c){return document.body.contains(c.host)});charts.forEach(drawChart)}
window.addEventListener("resize",redrawCharts);
function drawChart(c){
 var cfg=c.cfg,cv=c.cv,W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
 var dpr=window.devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;
 var g=cv.getContext("2d");g.scale(dpr,dpr);
 var muted=cssv("--muted"),border=cssv("--border"),pal=palette();
 var L=46,R=8,T=8,B=22,pw=W-L-R,ph=H-T-B,t0=Infinity,t1=-Infinity,mx=-Infinity,mn=Infinity;
 cfg.series.forEach(function(s){s.pts.forEach(function(p){if(p[0]<t0)t0=p[0];if(p[0]>t1)t1=p[0];if(num(p[1])){if(p[1]>mx)mx=p[1];if(p[1]<mn)mn=p[1]}})});
 if(!isFinite(t0)||t1<=t0){return}
 if(mx===-Infinity)mx=1;if(mn===Infinity)mn=0;
 var top,base=0;
 if(cfg.base!==undefined){
  base=cfg.base;top=cfg.max;
 }else if(cfg.max!==undefined){
  top=cfg.max;base=cfg.min!==undefined?cfg.min:0;
 }else{
  top=niceMax(mx*1.08||1);base=0;
 }
 if(top<=base)top=base+1;
 var rng=top-base;
 function X(t){return L+(t-t0)/(t1-t0)*pw}
 function Y(v){var clamped=Math.max(base,Math.min(v,top));return T+ph-(clamped-base)/rng*ph}
 g.font="12px -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif";g.lineWidth=1;
 g.fillStyle=muted;g.textAlign="right";g.textBaseline="middle";g.strokeStyle=border;
 for(var i=0;i<=4;i++){var v=base+rng*i/4,y=Math.round(Y(v))+.5;g.beginPath();g.moveTo(L,y);g.lineTo(W-R,y);g.stroke();g.fillText(cfg.axis(v),L-6,y)}
 g.textBaseline="top";
 var span=t1-t0,nt=Math.max(2,Math.min(6,Math.floor(pw/90)));
 for(var j=0;j<=nt;j++){var t=t0+span*j/nt;g.textAlign=j===0?"left":j===nt?"right":"center";g.fillText(span>90000?mdhm(t):hhmm(t),X(t),H-B+6)}
 var gap=(cfg.step||60)*3.5;
 cfg.series.forEach(function(s,si){
  var col=getColor(s,si);g.strokeStyle=col;g.lineWidth=1.6;g.lineJoin="round";
  var prev=null,pen=false;g.beginPath();
  s.pts.forEach(function(p){
   if(!num(p[1])){pen=false;prev=null;return}
   var x=X(p[0]),y=Y(p[1]);
   if(!pen||(prev!==null&&p[0]-prev>gap)){g.moveTo(x,y)}else g.lineTo(x,y);
   pen=true;prev=p[0]});
  g.stroke();
  if(cfg.series.length===1){g.lineTo(X(s.pts[s.pts.length-1][0]),Y(base));g.lineTo(X(s.pts[0][0]),Y(base));g.closePath();g.globalAlpha=.08;g.fillStyle=col;g.fill();g.globalAlpha=1}});
 if(c.hx!==null&&c.hx>=L&&c.hx<=W-R){
  var tt=t0+(c.hx-L)/pw*span,rows=[],tx=null;
  cfg.series.forEach(function(s,si){
   var best=null;s.pts.forEach(function(p){if(best===null||Math.abs(p[0]-tt)<Math.abs(best[0]-tt))best=p});
   if(best&&Math.abs(best[0]-tt)<=gap){tx=best[0];rows.push({s:s,p:best,col:getColor(s,si)})}});
  if(tx!==null){
   var x=X(tx);g.strokeStyle=muted;g.lineWidth=1;g.setLineDash([3,3]);g.beginPath();g.moveTo(x,T);g.lineTo(x,T+ph);g.stroke();g.setLineDash([]);
   rows.forEach(function(r){if(num(r.p[1])){g.fillStyle=r.col;g.beginPath();g.arc(x,Y(r.p[1]),3.5,0,7);g.fill()}});
   c.tip.innerHTML='<div class="t">'+mdhm(tx)+'</div>'+rows.map(function(r){return'<div><i style="background:'+r.col+'"></i>'+esc(r.s.name)+' '+esc(num(r.p[1])?cfg.fmt(r.p[1]):"—")+'</div>'}).join("");
   c.tip.style.display="block";
   var tw=c.tip.offsetWidth;c.tip.style.left=Math.max(L,Math.min(W-tw-4,x>W/2?x-tw-10:x+10))+"px";
   return}}
 c.tip.style.display="none"}
function getColor(s, i){
 if(s.color) return s.color;
 var p = palette();
 return p[i % p.length];
}
function chartCard(target,title,series,cfg,extraHeader){
 var wrap=document.createElement("div");wrap.className="chart-card";
 var has=series.some(function(s){return s.pts.length>1});
 var leg=series.map(function(s,i){var last=null;for(var k=s.pts.length-1;k>=0;k--)if(num(s.pts[k][1])){last=s.pts[k][1];break}
  return'<span><i style="background:'+getColor(s,i)+'"></i>'+esc(s.name)+'<b>'+esc(last===null?"—":cfg.fmt(last))+'</b></span>'}).join("");
 var hdr='<div class="chart-header"><h3>'+esc(title)+'</h3>'+(extraHeader||"")+'</div>';
 wrap.innerHTML=hdr+(has?'<div class="legend">'+leg+'</div><div class="chart"></div>':'<div class="nodata">暂无数据</div>');
 var container=typeof target==="string"?$(target):target;
 if(container)container.appendChild(wrap);
 if(has){cfg.series=series;makeChart(wrap.querySelector(".chart"),cfg)}}
function loadHistory(){
 var id=S.detailId,seq=++S.seq;if(id===null)return Promise.resolve();
 return api("/api/nodes/"+id+"/metrics?hours="+S.hours+"&points=360").then(function(d){
  if(seq!==S.seq)return;
  var resBox=$("#dResCharts"),netBox=$("#dNetCharts");
  if(!resBox||!netBox)return;
  resBox.innerHTML="";netBox.innerHTML="";charts=[];
  var rows=Array.isArray(d.metrics)?d.metrics:[],step=d.step||60;
  function ser(name,key,f){var raw=rows.map(function(r){return[r.ts,num(r[key])?(f?f(r[key]):r[key]):null]});return{name:name,pts:smoothPts(raw)}}
  var n=find(id)||{},memT=n.mem_total;

  var isDark = document.documentElement.getAttribute("data-theme") === "dark";

  /* --- 1. 系统资源：CPU (暖赭 / 砖红) --- */
  var cpuAvg=ser("平均","cpu"),cpuMax=ser("峰值","cpu_max");
  cpuAvg.color = isDark ? "#dca457" : "#b86e1e";
  cpuMax.color = isDark ? "#d66d6d" : "#b83a3a";
  var cpuVals=[].concat(cpuAvg.pts,cpuMax.pts).map(function(p){return p[1]}).filter(num);
  var cpuPeak=cpuVals.length?Math.max.apply(null,cpuVals):1;
  var cpuCfg={axis:function(v){return(v<10&&v>0?v.toFixed(1):Math.round(v))+"%"},fmt:function(v){return v.toFixed(1)+"%"},step:step};
  if(S.cpuScale==="fit"){
   var topV=niceMax(Math.max(1,cpuPeak*1.15));
   cpuCfg.max=Math.min(100,topV);
   cpuCfg.base=0;
  }else{
   cpuCfg.max=100;cpuCfg.base=0;
  }
  var cpuToggle='<div class="chart-toggles"><button class="chart-toggle'+(S.cpuScale==="fit"?" active":"")+'" data-toggle="cpu:fit">自适应</button><button class="chart-toggle'+(S.cpuScale==="abs"?" active":"")+'" data-toggle="cpu:abs">0-100%</button></div>';
  chartCard("#dResCharts","CPU 占用",[cpuAvg,cpuMax],cpuCfg,cpuToggle);

  /* --- 2. 系统资源：内存 (松针绿 / 藕灰紫) --- */
  var memSer={name:"内存",pts:smoothPts(rows.map(function(r){return[r.ts,ratio(r.mem_used,memT)]})),color:isDark?"#52b788":"#2e8555"};
  var swapSer=n.swap_total>0?{name:"交换",pts:rows.map(function(r){return[r.ts,ratio(r.swap_used,n.swap_total)]}),color:isDark?"#aa8fdc":"#6e52a8"}:null;
  var memSeries=[memSer].concat(swapSer?[swapSer]:[]);
  var memVals=memSer.pts.map(function(p){return p[1]}).filter(num);
  var memCfg={axis:function(v){return(v<10&&v>0?v.toFixed(1):Math.round(v))+"%"},fmt:function(v){return v.toFixed(1)+"%"},step:step};
  if(S.memScale==="fit"&&memVals.length){
   var minM=Math.min.apply(null,memVals),maxM=Math.max.apply(null,memVals);
   var spanM=Math.max(2,maxM-minM);
   memCfg.base=Math.max(0,Math.floor(minM-spanM*0.3));
   memCfg.max=Math.min(100,Math.ceil(maxM+spanM*0.3));
   if(memCfg.max<=memCfg.base)memCfg.max=memCfg.base+5;
  }else{
   memCfg.base=0;memCfg.max=100;
  }
  var memToggle='<div class="chart-toggles"><button class="chart-toggle'+(S.memScale==="fit"?" active":"")+'" data-toggle="mem:fit">自适应</button><button class="chart-toggle'+(S.memScale==="abs"?" active":"")+'" data-toggle="mem:abs">0-100%</button></div>';
  chartCard("#dResCharts","内存使用",memSeries,memCfg,memToggle);

  /* --- 3. 网络监控：实时带宽 (青川蓝 / 豆青绿 / 雅致淡紫与麦金) --- */
  var rxSer=ser("下行","net_rx"),txSer=ser("上行","net_tx");
  var rxPeakSer=ser("下行峰值","net_rx_max"),txPeakSer=ser("上行峰值","net_tx_max");
  rxSer.color = isDark ? "#88b5e8" : "#2d639b";
  txSer.color = isDark ? "#52b788" : "#2e8555";
  rxPeakSer.color = isDark ? "#9faae0" : "#5a68a5";
  txPeakSer.color = isDark ? "#dca457" : "#b86e1e";
  chartCard("#dNetCharts","带宽与网络速率",[rxSer,txSer,rxPeakSer,txPeakSer],{axis:function(v){return bytes(v).replace(" ","")},fmt:speed,step:step});

  /* --- 4. 网络监控：Ping 延迟 --- */
  var ping=Array.isArray(d.ping)?d.ping:[],ids=[],seen={};
  ping.forEach(function(p){if(!seen[p.task_id]){seen[p.task_id]=1;ids.push(p.task_id)}});
  if(ids.length){
   chartCard("#dNetCharts","线路延迟 (Ping)",ids.map(function(t){return{name:(d.probes&&d.probes[t])||("监控 "+t),pts:smoothPts(ping.filter(function(p){return p.task_id===t}).map(function(p){return[p.ts,num(p.latency)&&p.latency>0?p.latency:null]}))}}),{axis:function(v){return Math.round(v)+"ms"},fmt:function(v){return Math.round(v)+" ms"},step:step});
  }
 }).catch(function(e){
  if(seq!==S.seq)return;
  var b=$("#dResCharts");if(b)b.innerHTML='<div class="chart-card"><div class="nodata">'+esc(e.message||"历史数据加载失败")+'</div></div>';
 })}

/* ---------- 实时数据 ---------- */
function setNodes(d){
 if(!d||!Array.isArray(d.nodes))return;
 S.nodes=d.nodes;S.admin=!!d.admin;S.loaded=true;S.err="";S.lastFrame=Date.now();renderAll()}
function poll(){
 if(document.hidden)return Promise.resolve();
 return api("/api/nodes").then(function(d){if(document.hidden)return;setNodes(d)}).catch(function(e){if(document.hidden)return;S.err="连接异常，显示的是旧数据";S.loaded=true;renderAll()})}
function frameText(data){
 if(typeof data==="string")return Promise.resolve(data);
 return new Response(data.stream().pipeThrough(new DecompressionStream("gzip"))).text()}
var chain=Promise.resolve(),wsTimer=null,cdTimer=null;
function connect(){
 clearTimeout(wsTimer);clearInterval(cdTimer);
 if(document.hidden||S.ws)return;
 var ws;
 try{ws=new WebSocket((location.protocol==="https:"?"wss":"ws")+"://"+location.host+"/api/ws"+(typeof DecompressionStream==="function"?"?gzip":""))}catch(e){retry();return}
 S.ws=ws;
 ws.onopen=function(){
  S.wsFails=0;S.err="";
  renderLive();
 };
 ws.onmessage=function(ev){
  chain=chain.then(function(){return frameText(ev.data)}).then(function(t){
   if(S.ws!==ws)return;
   setNodes(JSON.parse(t));
  }).catch(function(){});
 };
 ws.onclose=ws.onerror=function(){
  if(S.ws===ws){
   S.ws=null;S.wsFails++;
   retry();
  }
 };
}
function retry(){
 clearTimeout(wsTimer);clearInterval(cdTimer);
 var delay = Math.min(30000, 3000 * Math.pow(1.6, Math.min(S.wsFails, 5)));
 var remain = Math.ceil(delay / 1000);
 S.reconnectSec = remain;
 S.err = "连接已断开，" + remain + " 秒后自动重连...";
 renderLive();
 cdTimer = setInterval(function(){
  remain--;
  if(remain <= 0){
   clearInterval(cdTimer);
   S.err = "正在重新连接...";
   renderLive();
   connect();
  } else {
   S.err = "连接已断开，" + remain + " 秒后自动重连...";
   renderLive();
  }
 }, 1000);
}
function renderLive(){
 var live=$("#live");if(!live)return;
 live.classList.toggle("err",!!S.err);
 $("#liveText").textContent=S.err||"实时更新中";
}
function stopWs(){clearTimeout(wsTimer);clearInterval(cdTimer);var w=S.ws;S.ws=null;if(w){try{w.close()}catch(e){}}}
setInterval(function(){if(!S.ws||Date.now()-S.lastFrame>12000)poll()},5000);
setInterval(function(){if(!document.hidden&&S.detailId!==null)loadHistory()},60000);
document.addEventListener("visibilitychange",function(){if(document.hidden){stopWs()}else{poll();S.wsFails=0;connect()}});

/* ---------- 交互与路由 ---------- */
function parseRoute(){var m=/^\/node\/(\d+)/.exec(location.pathname);S.routeId=m?parseInt(m[1],10):null}
function go(path){if(location.pathname!==path)history.pushState({},"",path);parseRoute();S.detailId=null;renderAll();window.scrollTo(0,0)}
window.addEventListener("popstate",function(){parseRoute();S.detailId=null;renderAll()});
document.addEventListener("click",function(e){
 var t=e.target.closest("button");if(!t)return;
 if(t.classList.contains("item")){go("/node/"+t.dataset.id)}
 else if(t.classList.contains("filter")){S.group=parseInt(t.dataset.g,10);renderAll()}
 else if(t.classList.contains("range")){S.hours=parseInt(t.dataset.h,10);renderRanges();loadHistory()}
 else if(t.dataset.toggle){
  var parts=t.dataset.toggle.split(":");
  if(parts[0]==="cpu")S.cpuScale=parts[1];
  else if(parts[0]==="mem")S.memScale=parts[1];
  loadHistory();
 }
 else if(t.classList.contains("status-bar")){
  if(t.title) showUptimeTip(t.title);
 }
 else if(t.classList.contains("detail-tab")){
  switchDetailTab(t.dataset.tab);
 }
 else if(t.id==="smoothToggle"||t.id==="netSmoothToggle"){
  S.smooth = !S.smooth;
  var txt = "削峰平滑: " + (S.smooth ? "开" : "关");
  var b1 = $("#smoothToggle"), b2 = $("#netSmoothToggle");
  if(b1) b1.textContent = txt;
  if(b2) b2.textContent = txt;
  loadHistory();
 }
 else if(t.id==="back"){var tip=document.getElementById("uptimeToast");if(tip)tip.classList.remove("show");go("/")}
 else if(t.id==="refresh"){
  var btn=t;
  btn.classList.add("spinning");
  var p1 = poll();
  var p2 = (S.detailId!==null) ? loadHistory() : Promise.resolve();
  var minSpin = new Promise(function(r){ setTimeout(r, 650); });
  Promise.all([Promise.resolve(p1), Promise.resolve(p2), minSpin]).then(function(){
   btn.classList.remove("spinning");
  }).catch(function(){
   btn.classList.remove("spinning");
  });
 }});
$("#q").addEventListener("input",function(){S.q=this.value;renderList();});

/* ---------- 启动 ---------- */
function boot(){
 parseRoute();initTheme();
 var cfgP=api("/api/themes/"+SHORT+"/config").catch(function(){return{}});
 var meP=api("/api/me").catch(function(){return{}});
 var nodesP=api("/api/nodes").catch(function(e){S.err=e.message||"加载失败";return null});
 Promise.all([cfgP,meP,nodesP]).then(function(r){
  var c=r[0]||{},me=r[1]||{};
  if(typeof c.notice==="string")S.cfg.notice=c.notice;
  if(c.mode==="auto"||c.mode==="light"||c.mode==="dark")S.cfg.mode=c.mode;
  if(typeof c.accent==="string")S.cfg.accent=c.accent;
  applyAccent(S.cfg.accent);
  if(num(me.history_days))S.me.history_days=me.history_days;
  var name=(typeof me.site_name==="string"?me.site_name:"").replace(/\s+/g," ").trim();
  if(name){$("#siteName").textContent=name;document.title=name}
  var nb=$("#notice");if(S.cfg.notice){nb.textContent=S.cfg.notice;nb.hidden=false}
  initTheme();
  if(r[2])setNodes(r[2]);else{S.loaded=true;renderAll()}
  connect()})}
boot();
})();
